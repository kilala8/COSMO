* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: #f8edff;
  background-color: var(--bg);
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  text-align: center;
}

a {
  color: inherit;
}

img {
  -webkit-user-drag: none;
  user-select: none;
}

#background-image {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    var(--neon-tile);
  background-repeat: repeat;
  background-size: 408px 408px;
  background-position: center;
}

#mycelium,
#spore-canvas,
#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#mycelium {
  z-index: 0;
  opacity: 0.3;
  background:
    radial-gradient(ellipse at 15% 25%, #642cff33, transparent 45%),
    radial-gradient(ellipse at 85% 65%, #ff36bd22, transparent 45%),
    radial-gradient(ellipse at 50% 90%, #00eaff1a, transparent 40%);
  animation: myceliumGlow 9s ease-in-out infinite alternate;
}

#spore-canvas {
  z-index: 1;
}

#stars {
  z-index: 1;
}

@keyframes myceliumGlow {
  from { opacity: 0.18; }
  to { opacity: 0.48; }
}

main {
  position: relative;
  z-index: 2;
  width: min(1040px, 93%);
  margin: 0 auto;
  padding: 55px 0 65px;
}

.big-frame {
  --frame-x: 22px;
  --frame-y: 30px;
  padding: var(--frame-y) var(--frame-x);
  border: 2px solid #ff7ad9;
  border-radius: 24px;
  background: rgba(8, 6, 32, 0.42);
  box-shadow:
    0 0 15px #ff7ad988,
    0 0 35px #ff3dc844,
    inset 0 0 25px #b68cff33;
  backdrop-filter: blur(3px);
  animation: fadeIn 1.6s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  margin: 0 0 12px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo-link {
  display: inline-block;
  position: relative;
  text-decoration: none;
}

.title-img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto;
  cursor: pointer;
  animation: neonBowaa 12s ease-in-out infinite;
  transition: transform 0.3s ease;
}

.title-img:hover {
  transform: scale(1.03);
}

.title-img.is-pop {
  animation:
    title-boyon 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    neonBowaa 12s ease-in-out infinite;
}

@keyframes title-boyon {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.2) rotate(-3deg); }
  60%  { transform: scale(0.93) rotate(2deg); }
  80%  { transform: scale(1.04); }
  100% { transform: scale(1); }
}

.logo-sparkle-particle {
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  z-index: 100;
  animation: pop-particle 0.6s ease-out forwards;
}

@keyframes pop-particle {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(var(--tx), var(--ty)) scale(0);
  }
}

@keyframes neonBowaa {
  0%   { filter: drop-shadow(0 0 3px #ff7ad9aa) drop-shadow(0 0 8px #ff3dc866); }
  12.5% { filter: drop-shadow(0 0 10px #ff7ad9) drop-shadow(0 0 24px #ff3dc8) drop-shadow(0 0 46px #b68cff99); }
  25%  { filter: drop-shadow(0 0 3px #4de1ffaa) drop-shadow(0 0 8px #00bfff66); }
  37.5% { filter: drop-shadow(0 0 10px #4de1ff) drop-shadow(0 0 24px #00bfff) drop-shadow(0 0 46px #4de1ff99); }
  50%  { filter: drop-shadow(0 0 3px #b6ff5caa) drop-shadow(0 0 8px #70f10066); }
  62.5% { filter: drop-shadow(0 0 10px #b6ff5c) drop-shadow(0 0 24px #70f100) drop-shadow(0 0 46px #b6ff5c99); }
  75%  { filter: drop-shadow(0 0 3px #b68cffaa) drop-shadow(0 0 8px #9d4edd66); }
  87.5% { filter: drop-shadow(0 0 10px #b68cff) drop-shadow(0 0 24px #9d4edd) drop-shadow(0 0 46px #ffe84a88); }
  100% { filter: drop-shadow(0 0 3px #ff7ad9aa) drop-shadow(0 0 8px #ff3dc866); }
}

@media (max-width: 600px) {
  main {
    padding-top: 25px;
  }

  .big-frame {
    --frame-x: 14px;
    --frame-y: 22px;
    padding: 22px 14px 24px;
  }

}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
@media (hover: none), (pointer: coarse) {
  *, *::before, *::after {
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
}

.big-frame {
  position: relative;
  isolation: isolate;
}

.big-frame::before,
.big-frame::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  pointer-events: none;
  z-index: -1;
}

.big-frame::before {
  box-shadow:
    0 0 22px 3px #ff7ad9,
    0 0 52px 6px #ff3dc8aa,
    inset 0 0 30px #ff7ad966;
  animation: frameGlowA 3.4s ease-in-out infinite alternate;
}

.big-frame::after {
  box-shadow:
    0 0 22px 3px #4de1ff,
    0 0 52px 6px #b68cffaa,
    inset 0 0 30px #4de1ff55;
  animation: frameGlowB 3.4s ease-in-out infinite alternate;
}

@keyframes frameGlowA {
  from { opacity: 0.35; }
  to   { opacity: 1; }
}

@keyframes frameGlowB {
  from { opacity: 1; }
  to   { opacity: 0.25; }
}

@media (prefers-reduced-motion: reduce) {
  .big-frame,
  .big-frame::before,
  .big-frame::after {
    animation: none !important;
  }
  .big-frame::before { opacity: 0.7; }
  .big-frame::after { opacity: 0.4; }
}

@media (prefers-reduced-motion: reduce) { .big-frame { animation: none !important; } }
.hero-banner {
  position: relative;
  display: grid;
  place-items: center;
  margin: calc(var(--frame-y) * -1) calc(var(--frame-x) * -1) 14px;
  overflow: hidden;
  border-radius: 22px 22px 0 0;
  border-bottom: 2px solid rgba(255, 122, 217, 0.7);
  box-shadow: 0 6px 18px rgba(255, 122, 217, 0.28);
}

.hero-bg {
  grid-area: 1 / 1;
  display: block;
  width: 100%;
  height: auto;
  opacity: 0.95;
  pointer-events: none;
}

.hero {
  padding: 0;
  text-align: center;
}

.hero-banner h1 {
  grid-area: 1 / 1;
  position: relative;
  z-index: 1;
  width: min(520px, 88%);
  margin: 0;
  display: block;
  line-height: 0;
}

.hero-banner .title-img {
  display: block;
  width: 100%;
  max-height: none;
  margin: 0 auto;
}

.page-back-wrap {
  margin: 40px 0 0;
  text-align: center;
  line-height: 0;
}

.page-back {
  display: inline-block;
  -webkit-tap-highlight-color: transparent;
}

.page-back img {
  display: block;
  width: min(140px, 44vw);
  height: auto;
  cursor: pointer;
  filter: drop-shadow(0 0 10px rgba(255, 122, 217, 0.55));
  transition:
    transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    filter 0.25s ease;
}

.page-back:hover img,
.page-back:focus-visible img {
  transform: scale(1.06);
  filter: drop-shadow(0 0 16px #ff7ad9);
}

.page-back:focus-visible {
  outline: 2px dashed #4de1ff;
  outline-offset: 4px;
  border-radius: 12px;
}

.page-back img.is-pop {
  animation: back-boyon 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes back-boyon {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.35) rotate(-3deg); }
  60%  { transform: scale(0.92) rotate(2deg); }
  80%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.hub-head {
  margin: 0 0 30px;
  text-align: center;
}

.hub-note {
  margin: 0;
  color: #e7dcff;
  font-size: 0.95rem;
  line-height: 1.9;
}

.star-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 22px;
  max-width: 900px;
  margin: 0 auto;
}

.star-card {
  --card-color: #b68cff;
  width: calc((100% - 44px) / 3);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 18px 12px 16px;
  border: none;
  border-radius: 18px;
  background: none;
  box-shadow: none;
  color: #fff;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.25s ease;
}

.star-card:nth-child(4n+2) { --card-color: #4de1ff; }
.star-card:nth-child(4n+3) { --card-color: #ff7ad9; }
.star-card:nth-child(4n+4) { --card-color: #b6ff5c; }

.star-card:hover,
.star-card:focus-visible {
  transform: translateY(-6px) scale(1.03);
  box-shadow: none;
  outline: none;
}

.star-img-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: grid;
  place-items: center;
  animation: starFloat 5s ease-in-out infinite alternate;
}

.star-card:nth-child(2n) .star-img-wrap { animation-delay: -2s; }
.star-card:nth-child(3n) .star-img-wrap { animation-delay: -3.5s; }

@keyframes starFloat {
  from { transform: translateY(0); }
  to   { transform: translateY(-8px); }
}

.star-card.is-pop .star-img-wrap {
  animation: fluffy-bounce 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.star-img-wrap img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0 10px var(--card-color)) drop-shadow(0 0 22px #ff7ad9aa);
}

.planet-fallback {
  position: relative;
  width: 62%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0%, #7aa8ff 22%, #5b3bd6 62%, #1a1048 100%);
  box-shadow: 0 0 18px var(--card-color), inset -8px -8px 16px rgba(0, 0, 20, 0.5);
}

.planet-fallback::after {
  content: "";
  position: absolute;
  left: -22%;
  top: 38%;
  width: 144%;
  height: 24%;
  border: 3px solid rgba(255, 232, 74, 0.8);
  border-radius: 50%;
  transform: rotate(-18deg);
  box-shadow: 0 0 10px #ffe84a99;
}

.star-name {
  font-size: 1.02rem;
  font-weight: bold;
  letter-spacing: 0.05em;
  text-align: center;
  text-shadow: 0 0 8px var(--card-color);
}

.star-sub {
  color: #cfc4ee;
  font-size: 0.78rem;
  line-height: 1.6;
  text-align: center;
}

@media (max-width: 600px) {
  .star-grid { gap: 14px; }
  .star-card { width: calc((100% - 14px) / 2); padding: 14px 8px 12px; }
  .star-name { font-size: 0.92rem; }
}

.big-frame { animation: none; }

.site-share-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 36px;
  padding: 16px 12px;
  border: 1px dashed #b68cffaa;
  border-radius: 14px;
  background: rgba(8,6,32,0.62);
}

.site-share-label {
  color: var(--pink);
  font-size: .8rem;
  font-weight: bold;
  letter-spacing: .1em;
  text-align: center;
  text-shadow: 0 0 8px #ff7ad980;
  flex-basis: 100%;
}

.site-share-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1.5px solid var(--cyan);

<script>
"use strict";

document.addEventListener("contextmenu", (e) => {
  e.preventDefault();
});

document.addEventListener("dragstart", (e) => {
  if (e.target.tagName === "IMG") {
    e.preventDefault();
  }
});

(() => {
  const logoLink = document.getElementById("logoLink");
  const logoImg = document.getElementById("logoImg");

  if (!logoLink || !logoImg) return;

  function playBounceSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';

      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    } catch (e) {
    }
  }

  function createLogoSparkles(rect) {
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const colors = ['#ffe84a', '#ff7ad9', '#4de1ff', '#b6ff5c', '#ffffff'];

    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'logo-sparkle-particle';
      
      const size = Math.random() * 8 + 4;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = centerX + 'px';
      p.style.top = centerY + 'px';

      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 70 + 30;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');

      document.body.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
  }

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pending = false;

  logoLink.addEventListener("click", (e) => {
    if (e.defaultPrevented || e.button !== 0 ||
        e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const href = logoLink.getAttribute("href");
    if (href && href !== "#") {
      e.preventDefault();
      if (pending) return;
      pending = true;
      if (reduceMotion) { window.location.href = href; return; }

      logoImg.classList.remove("is-pop");
      void logoImg.offsetWidth; 
      logoImg.classList.add("is-pop");

      playBounceSound();
      createLogoSparkles(logoImg.getBoundingClientRect());

      setTimeout(() => {
        window.location.href = href;
      }, 350);
    }
  });

  window.addEventListener("pageshow", () => {
    pending = false;
    logoImg.classList.remove("is-pop");
  });

  window.playBounceSound = playBounceSound;
  window.createLogoSparkles = createLogoSparkles;
})();

(() => {
  const canvas = document.getElementById("spore-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  const IS_TOUCH = window.matchMedia("(hover: none), (pointer: coarse)").matches;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const FRAME_MS = IS_TOUCH ? 1000 / 30 : 0;
  let lastFrame = 0;

  let width = 0;
  let height = 0;
  let spores = [];
  let mouseX = 0;
  let mouseY = 0;
  let animationId = null;

  const colors = ["#ff7ad9", "#4de1ff", "#ffe84a", "#b68cff", "#b6ff5c"];

  const GLOW = {};
  const STAR = {};

  function glowSprite(color) {
    if (GLOW[color]) return GLOW[color];
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, color + "dd");
    grad.addColorStop(0.25, color + "77");
    grad.addColorStop(0.6, color + "22");
    grad.addColorStop(1, color + "00");
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return (GLOW[color] = c);
  }

  function starSprite(color) {
    if (STAR[color]) return STAR[color];
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    g.translate(32, 32);
    g.shadowColor = color;
    g.shadowBlur = 8;
    const grad = g.createRadialGradient(0, 0, 0, 0, 0, 26);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.3, color);
    grad.addColorStop(1, color + "bb");
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(0, -26);
    g.quadraticCurveTo(2.5, -2.5, 26, 0);
    g.quadraticCurveTo(2.5, 2.5, 0, 26);
    g.quadraticCurveTo(-2.5, 2.5, -26, 0);
    g.quadraticCurveTo(-2.5, -2.5, 0, -26);
    g.closePath();
    g.fill();
    return (STAR[color] = c);
  }

  function drawSpore(ctx, sp, x, y, advance) {
    if (advance) sp.tw += sp.twSpeed;
    const flash = Math.pow(0.5 + 0.5 * Math.sin(sp.tw), 3);
    const a = Math.min(1, sp.alpha + 0.25) * (0.3 + 0.7 * flash);

    if (sp.star) {
      const size = (9 + sp.size * 4.5) * (0.55 + 0.75 * flash);
      const halo = size * 1.6;
      ctx.globalAlpha = a * 0.55;
      ctx.drawImage(glowSprite(sp.color), x - halo, y - halo, halo * 2, halo * 2);
      ctx.globalAlpha = Math.min(1, a * 1.25);
      ctx.drawImage(starSprite(sp.color), x - size, y - size, size * 2, size * 2);
    } else {
      const halo = 5 + sp.size * 3.2 + flash * 7;
      ctx.globalAlpha = a * 0.8;
      ctx.drawImage(glowSprite(sp.color), x - halo, y - halo, halo * 2, halo * 2);
      ctx.globalAlpha = Math.min(1, a + 0.2);
      ctx.fillStyle = sp.color;
      ctx.beginPath();
      ctx.arc(x, y, sp.size * (0.8 + 0.5 * flash), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function createSpore(randomY = false) {
    return {
      x: Math.random() * width,
      y: randomY ? Math.random() * height : height + 10,
      size: Math.random() * 2.1 + 0.5,
      speed: Math.random() * 0.55 + 0.12,
      drift: (Math.random() - 0.5) * 0.45,
      alpha: Math.random() * 0.5 + 0.35,
      color: colors[Math.floor(Math.random() * colors.length)],
      phase: Math.random() * Math.PI * 2,
      tw: Math.random() * Math.PI * 2,
      twSpeed: 0.03 + Math.random() * 0.07,
      star: Math.random() < 0.2
    };
  }

  function render(advance) {
    ctx.clearRect(0, 0, width, height);
    ctx.globalCompositeOperation = "lighter";
    for (const spore of spores) {
      drawSpore(ctx, spore, spore.x + mouseX * 0.012, spore.y + mouseY * 0.012, advance);
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2);
    const prevWidth = width;

    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    if (!spores.length || width !== prevWidth) {
      const count = Math.min(180, Math.max(60, Math.floor((width * height) / 8500)));
      const total = IS_TOUCH ? Math.ceil(count * 0.6) : count;
      spores = Array.from({ length: total }, () => createSpore(true));
    }

    if (reduceMotion) render(false);
  }

  function animate(now) {
    if (document.hidden) { animationId = requestAnimationFrame(animate); return; }
    if (FRAME_MS && now - lastFrame < FRAME_MS) { animationId = requestAnimationFrame(animate); return; }
    lastFrame = now || 0;

    for (const spore of spores) {
      spore.phase += 0.015;
      spore.x += spore.drift + Math.sin(spore.phase) * 0.12;
      spore.y -= spore.speed;

      if (spore.y < -10) Object.assign(spore, createSpore(false));
      if (spore.x < -10) spore.x = width + 10;
      if (spore.x > width + 10) spore.x = -10;
    }

    render(true);
    animationId = requestAnimationFrame(animate);
  }

  function stopAnimation() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
  }

  function startAnimation() {
    stopAnimation();
    if (reduceMotion) render(false);
    else animationId = requestAnimationFrame(animate);
  }

  window.addEventListener("resize", () => {
    resize();
    startAnimation();
  }, { passive: true });

  window.addEventListener("mousemove", (event) => {
    mouseX = event.clientX - width / 2;
    mouseY = event.clientY - height / 2;
  }, { passive: true });

  resize();
  startAnimation();
})();

(() => {
  const container = document.getElementById("stars");
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < (window.matchMedia("(hover: none), (pointer: coarse)").matches ? 25 : 50); i++) {
    const star = document.createElement("span");

    star.textContent = "✦";
    star.setAttribute("aria-hidden", "true");

    Object.assign(star.style, {
      position: "absolute",
      left: Math.random() * 100 + "%",
      top: Math.random() * 100 + "%",
      color: i % 2 ? "#4de1ff" : "#ff7ad9",
      fontSize: Math.random() * 9 + 5 + "px",
      opacity: String(Math.random() * 0.55 + 0.12),
      textShadow: "0 0 8px currentColor",
      animation: `starBlink ${Math.random() * 3 + 2}s ease-in-out infinite alternate`,
      animationDelay: Math.random() * -5 + "s"
    });

    fragment.appendChild(star);
  }

  const style = document.createElement("style");
  style.textContent = `
    @keyframes starBlink {
      from { opacity: 0.12; }
      to { opacity: 0.85; }
    }
  `;

  document.head.appendChild(style);
  container.appendChild(fragment);
})();

document.addEventListener("click", (event) => {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    return;
  }

  const colors = ["#ff7ad9", "#4de1ff", "#ffe84a", "#b68cff"];

  for (let i = 0; i < 6; i++) {
    const spark = document.createElement("span");
    const angle = Math.PI * 2 * i / 6;
    const distance = 18 + Math.random() * 24;

    spark.textContent = "✦";

    Object.assign(spark.style, {
      position: "fixed",
      left: event.clientX + "px",
      top: event.clientY + "px",
      zIndex: "99",
      pointerEvents: "none",
      color: colors[i % colors.length],
      fontSize: "13px",
      textShadow: "0 0 8px currentColor",
      transition: "transform 550ms ease-out, opacity 550ms ease-out"
    });

    document.body.appendChild(spark);

    requestAnimationFrame(() => {
      spark.style.transform =
        `translate(${Math.cos(angle) * distance}px,${Math.sin(angle) * distance}px)`;
      spark.style.opacity = "0";
    });

    window.setTimeout(() => spark.remove(), 650);
  }
});

(() => {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const targets = document.querySelectorAll(".title-img, .star-img-wrap");
  const colors = ["#ff65c3", "#b6ff5c", "#62f7ff", "#b68cff", "#ffb85c", "#ffe84a"];
  const marks = ["✦", "✧", "✨"];

  function sparkle(element) {
    const rect = element.getBoundingClientRect();
    const spark = document.createElement("span");

    spark.textContent = marks[Math.floor(Math.random() * marks.length)];

    const sparkLeft = rect.left + window.scrollX + Math.random() * rect.width;
    const sparkTop = rect.top + window.scrollY + Math.random() * rect.height;

    Object.assign(spark.style, {
      position: "absolute",
      left: sparkLeft + "px",
      top: sparkTop + "px",
      zIndex: "9999",
      pointerEvents: "none",
      color: colors[Math.floor(Math.random() * colors.length)],
      fontSize: (9 + Math.random() * 10) + "px",
      textShadow: "0 0 8px currentColor",
      opacity: "1",
      transition: "transform 750ms ease-out, opacity 750ms ease-out"
    });

    document.body.appendChild(spark);

    requestAnimationFrame(() => {
      const dx = (Math.random() - 0.5) * 44;
      const dy = -(18 + Math.random() * 32);
      const rot = (Math.random() - 0.5) * 180;
      spark.style.transform =
        `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.4)`;
      spark.style.opacity = "0";
    });

    window.setTimeout(() => spark.remove(), 800);
  }

  targets.forEach((element) => {
    let timer = null;

    element.addEventListener("mouseenter", () => {
      if (timer) return;
      sparkle(element);
      timer = window.setInterval(() => sparkle(element), 90);
    });

    element.addEventListener("mouseleave", () => {
      if (timer) {
        window.clearInterval(timer);
        timer = null;
      }
    });
  });
})();

(() => {
  const link = document.querySelector(".page-back");
  const img = link && link.querySelector("img");
  if (!link || !img) return;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  link.addEventListener("click", (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    const href = link.getAttribute("href");
    if (!href || href === "#" || reduceMotion) return;

    e.preventDefault();
    img.classList.remove("is-pop");
    void img.offsetWidth;
    img.classList.add("is-pop");

    if (window.playBounceSound) window.playBounceSound();

    setTimeout(() => {
      window.location.href = href;
    }, 350);
  });
})();

(() => {
  const cards = document.querySelectorAll(".star-card");
  if (!cards.length) return;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  cards.forEach((card) => {
    card.addEventListener("click", (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      const href = card.getAttribute("href");
      if (!href || href === "#" || reduceMotion) return;

      e.preventDefault();
      if (card.dataset.going) return;
      card.dataset.going = "1";

      card.classList.remove("is-pop");
      void card.offsetWidth;
      card.classList.add("is-pop");

      if (window.playBounceSound) window.playBounceSound();
      const wrap = card.querySelector(".star-img-wrap");
      if (window.createLogoSparkles && wrap) window.createLogoSparkles(wrap.getBoundingClientRect());

      setTimeout(() => {
        window.location.href = href;
      }, 350);
    });
  });

  window.addEventListener("pageshow", () => {
    cards.forEach((card) => {
      card.classList.remove("is-pop");
      delete card.dataset.going;
    });
  });
})();
</script>
<script>
"use strict";

(() => {
  const currentUrl = window.location.href.split(/[?#]/)[0].replace(/index\.html$/, "");
  const shareText = document.title;
  const shareX = document.getElementById("share-x");
  const shareLine = document.getElementById("share-line");
  const shareCopy = document.getElementById("share-copy");

  if (shareX) {
    shareX.href =
      `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}` +
      `&url=${encodeURIComponent(currentUrl)}&hashtags=KINOKO_ZONE`;
  }

  if (shareLine) {
    shareLine.href =
      `https://line.me/R/msg/text/?${encodeURIComponent(shareText + "\n" + currentUrl)}`;
  }

  if (shareCopy) {
    shareCopy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(currentUrl);
        shareCopy.textContent = "✓ コピーしたじょ！";
      } catch (error) {
        window.prompt("このURLをコピーしてください", currentUrl);
      }

      window.setTimeout(() => {
        shareCopy.textContent = "🔗 URLコピー";
      }, 1800);
    });
  }
})();
</script>
