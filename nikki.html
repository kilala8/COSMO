* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

#background-image {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    var(--neon-tile);
  background-repeat: repeat;
  background-size: 408px 408px;
  background-position: center;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: #f8edff;
  background-color: var(--bg);
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  text-align: center;
}

img {
  -webkit-user-drag: none;
  -webkit-user-select: none;
  user-select: none;
}

#mycelium,
#spore-canvas,
#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#mycelium {
  z-index: 0;
  opacity: .3;
  background:
    radial-gradient(ellipse at 15% 25%, #642cff33, transparent 45%),
    radial-gradient(ellipse at 85% 65%, #ff36bd22, transparent 45%),
    radial-gradient(ellipse at 50% 90%, #00eaff1a, transparent 40%);
  animation: myceliumGlow 9s ease-in-out infinite alternate;
}

#spore-canvas {
  z-index: 1;
}

#stars {
  z-index: 1;
}

@keyframes myceliumGlow {
  from { opacity: .18; }
  to { opacity: .48; }
}

@keyframes starBlink {
  from { opacity: .12; }
  to { opacity: .85; }
}

main {
  position: relative;
  z-index: 2;
  width: min(1040px, 93%);
  margin: 0 auto;
  padding: 55px 0 65px;
}

.big-frame {
  padding: 36px 34px 40px;
  border: 2px solid #ff7ad9;
  border-radius: 24px;
  background: rgba(8, 6, 32, 0.42);
  box-shadow:
    0 0 15px #ff7ad988,
    0 0 35px #ff3dc844,
    inset 0 0 25px #b68cff33;
  backdrop-filter: blur(3px);
  animation: fadeIn 1.6s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  margin: 0;
  display: block;
  line-height: 0;
}

.hero-banner {
  position: relative;
  display: grid;
  place-items: center;
  margin: -36px -34px 0;
  overflow: hidden;
  border-radius: 22px 22px 0 0;
  border-bottom: 2px solid rgba(255, 122, 217, 0.7);
  box-shadow: 0 6px 18px rgba(255, 122, 217, 0.28);
}

.hero-bg {
  grid-area: 1 / 1;
  display: block;
  width: 100%;
  height: auto;
  opacity: 0.95;
  pointer-events: none;
}

.hero-banner h1 {
  grid-area: 1 / 1;
  position: relative;
  z-index: 1;
  width: min(650px, 94%);
}

.title-link {
  display: block;
  text-decoration: none;
}

.neon-nikki-title {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto;
  pointer-events: auto;
  cursor: pointer;
  animation: neonBowaa 12s ease-in-out infinite;
  transition: transform 0.3s ease;
}

.neon-nikki-title:hover {
  transform: scale(1.03);
}

.neon-nikki-title.is-pop {
  animation:
    header-boyon 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    neonBowaa 12s ease-in-out infinite;
}

@keyframes neonBowaa {
  0%   { filter: drop-shadow(0 0 3px #ff7ad9aa) drop-shadow(0 0 8px #ff3dc866); }
  12.5% { filter: drop-shadow(0 0 10px #ff7ad9) drop-shadow(0 0 24px #ff3dc8) drop-shadow(0 0 46px #b68cff99); }
  25%  { filter: drop-shadow(0 0 3px #4de1ffaa) drop-shadow(0 0 8px #00bfff66); }
  37.5% { filter: drop-shadow(0 0 10px #4de1ff) drop-shadow(0 0 24px #00bfff) drop-shadow(0 0 46px #4de1ff99); }
  50%  { filter: drop-shadow(0 0 3px #b6ff5caa) drop-shadow(0 0 8px #70f10066); }
  62.5% { filter: drop-shadow(0 0 10px #b6ff5c) drop-shadow(0 0 24px #70f100) drop-shadow(0 0 46px #b6ff5c99); }
  75%  { filter: drop-shadow(0 0 3px #b68cffaa) drop-shadow(0 0 8px #9d4edd66); }
  87.5% { filter: drop-shadow(0 0 10px #b68cff) drop-shadow(0 0 24px #9d4edd) drop-shadow(0 0 46px #ffe84a88); }
  100% { filter: drop-shadow(0 0 3px #ff7ad9aa) drop-shadow(0 0 8px #ff3dc866); }
}

@keyframes header-boyon {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.08) rotate(-0.6deg); }
  60%  { transform: scale(0.99) rotate(0.4deg); }
  80%  { transform: scale(1.02); }
  100% { transform: scale(1); }
}

@keyframes fluffy-bounce {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.35) rotate(-3deg); }
  60%  { transform: scale(0.92) rotate(2deg); }
  80%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.logo-sparkle-particle {
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  z-index: 100;
  animation: pop-particle 0.6s ease-out forwards;
}

@keyframes pop-particle {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(var(--tx), var(--ty)) scale(0);
  }
}

@keyframes neonPulseGlow {
  0% {
    filter:
      drop-shadow(0 0 6px #fff)
      drop-shadow(0 0 16px #ff7ad9)
      drop-shadow(0 0 32px #ff3dc8)
      drop-shadow(0 0 50px rgba(255, 61, 200, 0.6));
    opacity: 1;
  }
  10% {
    filter:
      drop-shadow(0 0 2px #fff)
      drop-shadow(0 0 8px #ff7ad9)
      drop-shadow(0 0 16px rgba(255, 61, 200, 0.4));
    opacity: 0.82;
  }
  25% {
    filter:
      drop-shadow(0 0 6px #fff)
      drop-shadow(0 0 16px #4de1ff)
      drop-shadow(0 0 32px #00eaff)
      drop-shadow(0 0 50px rgba(0, 234, 255, 0.6));
    opacity: 1;
  }
  35% {
    filter:
      drop-shadow(0 0 2px #fff)
      drop-shadow(0 0 8px #4de1ff)
      drop-shadow(0 0 16px rgba(0, 234, 255, 0.4));
    opacity: 0.82;
  }
  50% {
    filter:
      drop-shadow(0 0 6px #fff)
      drop-shadow(0 0 16px #b6ff5c)
      drop-shadow(0 0 32px #82ff28)
      drop-shadow(0 0 50px rgba(130, 255, 40, 0.6));
    opacity: 1;
  }
  60% {
    filter:
      drop-shadow(0 0 2px #fff)
      drop-shadow(0 0 8px #b6ff5c)
      drop-shadow(0 0 16px rgba(130, 255, 40, 0.4));
    opacity: 0.82;
  }
  75% {
    filter:
      drop-shadow(0 0 6px #fff)
      drop-shadow(0 0 16px #ffe84a)
      drop-shadow(0 0 32px #ffcc00)
      drop-shadow(0 0 50px rgba(255, 204, 0, 0.6));
    opacity: 1;
  }
  85% {
    filter:
      drop-shadow(0 0 2px #fff)
      drop-shadow(0 0 8px #ffe84a)
      drop-shadow(0 0 16px rgba(255, 204, 0, 0.4));
    opacity: 0.82;
  }
  100% {
    filter:
      drop-shadow(0 0 6px #fff)
      drop-shadow(0 0 16px #b68cff)
      drop-shadow(0 0 32px #924dff)
      drop-shadow(0 0 50px rgba(146, 77, 255, 0.6));
    opacity: 1;
  }
}

.filter-container[hidden] {
  display: none;
}

.back-wrap {
  margin: 0;
  text-align: center;
}

.back-wrap.top {
  margin-bottom: 22px;
}

.back-link {
  display: inline-block;
  padding: 8px 18px;
  border: 1.5px solid var(--cyan);
  border-radius: 10px;
  background: rgba(12, 10, 40, 0.7);
  color: #fff;
  font-size: 0.88rem;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 0 8px #4de1ff4d;
  transition: all 0.2s ease;
}

.back-link:hover,
.back-link:focus-visible {
  background: var(--cyan);
  color: #070720;
  box-shadow: 0 0 16px var(--cyan);
  outline: none;
}

.calendar-box {
  max-width: 360px;
  margin: 0 auto 24px;
  padding: 12px 14px 14px;
  border: 1px solid var(--purple);
  border-radius: 16px;
  background: rgba(12, 10, 40, 0.70);
  box-shadow: 0 0 12px rgba(182, 140, 255, 0.2);
}

.calendar-box[hidden] {
  display: none;
}

.calendar-box summary {
  color: var(--cyan);
  font-size: 0.9rem;
  font-weight: bold;
  text-shadow: 0 0 6px var(--cyan);
  cursor: pointer;
  list-style: none;
}

.calendar-box summary::-webkit-details-marker {
  display: none;
}

.calendar-box summary::after {
  content: " ▾";
}

.calendar-box[open] summary::after {
  content: " ▴";
}

.calendar-box summary:focus-visible {
  outline: 2px dashed var(--cyan);
  outline-offset: 4px;
  border-radius: 6px;
}

.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 14px 0 10px;
}

.cal-title {
  color: #fff;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-shadow: 0 0 10px var(--pink);
}

.cal-nav {
  min-width: 38px;
  padding: 5px 10px;
  border: 1px solid var(--purple);
  border-radius: 8px;
  background: rgba(22, 11, 43, 0.8);
  color: #f8edff;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}

.cal-nav:hover:not(:disabled),
.cal-nav:focus-visible:not(:disabled) {
  background: var(--purple);
  color: #070720;
  outline: none;
}

.cal-nav:disabled {
  opacity: 0.35;
  cursor: default;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}

.cal-week {
  padding-bottom: 4px;
  color: #bdb5d8;
  font-size: 0.72rem;
  font-weight: bold;
}

.cal-week.sun { color: var(--coral, #ff7a7a); }
.cal-week.sat { color: var(--cyan); }

.cal-day {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 8px;
  background: none;
  color: #8f88aa;
  font: inherit;
  font-size: 0.85rem;
}

.cal-day.today {
  border: 1px dashed var(--cyan);
}

.cal-day.has-posts {
  border: 1px solid var(--pink);
  background: rgba(255, 122, 217, 0.12);
  color: #fff;
  font-weight: bold;
  text-shadow: 0 0 6px var(--pink);
  box-shadow: 0 0 8px #ff7ad944;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
}

.cal-day.has-posts:hover,
.cal-day.has-posts:focus-visible {
  background: rgba(255, 122, 217, 0.3);
  transform: translateY(-2px);
  outline: none;
}

.cal-day.has-posts::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 50%;
  width: 4px;
  height: 4px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: var(--yellow);
  box-shadow: 0 0 6px var(--yellow);
}

.cal-day.selected {
  background: var(--pink);
  color: #070720;
  text-shadow: none;
  box-shadow: 0 0 14px var(--pink);
}

.cal-day.selected::after {
  background: #070720;
  box-shadow: none;
}

.cal-status {
  margin: 12px 0 0;
  color: var(--yellow);
  font-size: 0.8rem;
  font-weight: bold;
}

.cal-clear {
  margin-left: 6px;
  padding: 3px 10px;
  border: 1px solid var(--yellow);
  border-radius: 8px;
  background: none;
  color: var(--yellow);
  font: inherit;
  font-size: 0.75rem;
  cursor: pointer;
}

.cal-clear:hover,
.cal-clear:focus-visible {
  background: var(--yellow);
  color: #070720;
  outline: none;
}

.filter-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 28px;
  padding: 14px 20px;
  background: rgba(12, 10, 40, 0.70);
  border: 1px solid var(--purple);
  border-radius: 16px;
  box-shadow: 0 0 12px rgba(182, 140, 255, 0.2);
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.filter-label {
  font-size: 0.85rem;
  font-weight: bold;
  color: var(--cyan);
  text-shadow: 0 0 6px var(--cyan);
}

.filter-select {
  padding: 6px 12px;
  border: 1.5px solid var(--pink);
  border-radius: 10px;
  background: #070720;
  color: #fff;
  font-size: 0.88rem;
  font-weight: bold;
  outline: none;
  cursor: pointer;
  box-shadow: 0 0 8px rgba(255, 122, 217, 0.3);
  transition: all 0.2s ease;
}

.filter-select:hover, .filter-select:focus {
  border-color: var(--lime);
  box-shadow: 0 0 12px var(--lime);
}

.message {
  margin: 10px 0;
  color: #e7dcff;
  font-weight: bold;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.message.is-error {
  color: #ff7a7a;
  text-shadow: 0 0 10px #ff7a7a88;
}

#posts-container {
  display: grid;
  gap: 26px;
  text-align: left;
}

.post-card {
  --card-color: #62f7ff;
  padding: 26px 28px;
  border: 2px solid var(--card-color);
  border-radius: 16px;
  background: rgba(8, 8, 32, 0.62);
  box-shadow:
    0 0 12px color-mix(in srgb, var(--card-color) 60%, transparent),
    inset 0 0 15px color-mix(in srgb, var(--card-color) 20%, transparent);
  backdrop-filter: blur(2px);
  transition:
    transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    box-shadow 0.3s ease;
}

.post-card:hover {
  transform: translateY(-4px);
  box-shadow:
    0 0 20px var(--card-color),

"use strict";

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

(() => {
  let sharedAudioCtx = null;

  function playBounceSound() {
    try {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;

      if (!sharedAudioCtx) sharedAudioCtx = new AudioCtor();
      const audioCtx = sharedAudioCtx;
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';

      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    } catch (e) {
    }
  }

  function createLogoSparkles(rect) {
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const colors = ['#ffe84a', '#ff7ad9', '#4de1ff', '#b6ff5c', '#ffffff'];

    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'logo-sparkle-particle';
      
      const size = Math.random() * 8 + 4;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = centerX + 'px';
      p.style.top = centerY + 'px';

      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 70 + 30;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');

      document.body.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
  }

  function attachBoyon(link, img) {
    if (!link || !img) return;

    let pending = false;

    link.addEventListener("click", (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

      const href = link.getAttribute("href");
      if (!href || href === "#") return;

      e.preventDefault();
      if (pending) return;
      pending = true;

      if (!reduceMotion) {
        img.classList.remove("is-pop");
        void img.offsetWidth;
        img.classList.add("is-pop");

        playBounceSound();
        createLogoSparkles(img.getBoundingClientRect());
      }

      setTimeout(() => {
        window.location.href = href;
      }, reduceMotion ? 0 : 350);
    });

    window.addEventListener("pageshow", () => {
      pending = false;
      img.classList.remove("is-pop");
    });
  }

  attachBoyon(document.getElementById("titleLink"), document.getElementById("titleImg"));
  attachBoyon(
    document.querySelector(".profile-icon"),
    document.querySelector(".profile-icon .header-icon-img")
  );
})();

function showMessage(text, isError) {
  const p = document.createElement('p');
  p.className = 'message' + (isError ? ' is-error' : '');
  p.textContent = text;
  container.replaceChildren(p);

function sortNewestFirst(posts) {
  const list = [...posts];

  if (list.some((post) => post.created_at)) {
    list.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
  } else if (list.some((post) => post.id !== undefined && post.id !== null)) {
    list.sort((a, b) => (a.id < b.id ? 1 : a.id > b.id ? -1 : 0));
  }

  return list;
}

function formatDate(value) {
  if (!value) return '';

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';

  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');

  return `${y}.${m}.${d}`;
}

function formatYearMonth(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  return `${y}-${m}`;
}

function parseImageUrls(value) {
  if (!value) return [];
  const text = String(value).trim();

  if (text.startsWith('[')) {
    try {
      const list = JSON.parse(text);
      if (Array.isArray(list)) {
        return list.filter(url => typeof url === 'string' && url);
      }
    } catch (error) {
    }
  }

  return text ? [text] : [];
}

function safeImageUrl(url) {
  try {
    const parsed = new URL(url);
    return parsed.protocol === 'https:' || parsed.protocol === 'http:'
      ? parsed.href
      : null;
  } catch (error) {
    return null;
  }
}

const SAFE_COLOR = /^(#[0-9a-fA-F]{3,8}|[a-zA-Z]{3,20}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*[\d.]{1,4}\s*)?\))$/;
const SAFE_SIZE = /^\d{1,3}(\.\d{1,2})?(px|em|rem|%)$/;
const SAFE_URL = /^https?:\/\/[^\s"'<>`]+$/i;
const YOUTUBE_ID = /^https?:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:[^\s"'<>]*?&amp;)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})(?![A-Za-z0-9_-])/i;
const TWITTER_URL = /^https?:\/\/(?:www\.)?(?:twitter\.com|x\.com)\/[A-Za-z0-9_]+\/status\/([0-9]+)/i;

function buildLinkHtml(url, label) {
  const text = label.trim() ? label : url;
  return `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`;
}

function buildYoutubeHtml(id, embed) {
  if (!embed) {
    return `<span class="yt-embed yt-preview"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="YouTube動画のサムネイル" loading="lazy"><span class="yt-badge">▶ YouTube（公開ページで再生されます）</span></span>`;
  }
  return `<button type="button" class="yt-embed yt-facade" data-yt-id="${id}" aria-label="YouTube動画を再生"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"><span class="yt-play" aria-hidden="true">▶</span></button>`;
}

function buildTwitterHtml(url) {
  const m = /(?:twitter\.com|x\.com)\/([A-Za-z0-9_]+)\/status\/([0-9]+)/i.exec(url);
  const canonical = m ? `https://twitter.com/${m[1]}/status/${m[2]}` : url;
  return `<div class="twitter-tweet-container"><blockquote class="twitter-tweet" data-dnt="true" data-theme="dark"><a href="${canonical}"></a></blockquote></div>`;
}

function formatContentWithTags(rawText, options = {}) {
  const embed = options.embed !== false;
  const images = options.images || [];
  const text = rawText || '';
  const div = document.createElement('div');
  div.textContent = text;
  let escaped = div.innerHTML;

  let prev;
  do {
    prev = escaped;
    escaped = escaped
      .replace(/\[b\]([\s\S]*?)\[\/b\]/g,
        '<strong style="font-weight: bold; text-shadow: 0 0 6px currentColor;">$1</strong>')
      .replace(/\[color=([^\]]*?)\]([\s\S]*?)\[\/color\]/g, (match, value, inner) => {
        const v = value.trim();
        return SAFE_COLOR.test(v)
          ? `<span style="color: ${v}; text-shadow: 0 0 8px ${v};">${inner}</span>`
          : inner;
      })
      .replace(/\[size=([^\]]*?)\]([\s\S]*?)\[\/size\]/g, (match, value, inner) => {
        const v = value.trim();
        return SAFE_SIZE.test(v)
          ? `<span style="font-size: ${v};">${inner}</span>`
          : inner;
      });
  } while (escaped !== prev);

  escaped = escaped
    .replace(/\[url=([^\]]*?)\]([\s\S]*?)\[\/url\]/g, (match, href, label) => {
      const url = href.trim();
      return SAFE_URL.test(url) ? buildLinkHtml(url, label) : match;
    })
    .replace(/\[url\]([\s\S]*?)\[\/url\]/g, (match, href) => {
      const url = href.trim();
      return SAFE_URL.test(url) ? buildLinkHtml(url, url) : match;
    })
    .replace(/\n?\[youtube\]([\s\S]*?)\[\/youtube\]\n?/g, (match, href) => {
      const found = YOUTUBE_ID.exec(href.trim());
      return found ? buildYoutubeHtml(found[1], embed) : match;
    })
    .replace(/\n?\[x\]([\s\S]*?)\[\/x\]\n?/g, (match, href) => {
      const url = href.trim();
      return TWITTER_URL.test(url) ? buildTwitterHtml(url) : match;
    })
    .replace(/\n?\[img=(\d+)\]\n?/g, (match, n) => {
      const index = parseInt(n, 10) - 1;
      return images[index]
        ? `<span class="inline-img-slot" data-img="${index}"></span>`
        : match;
    });

  return escaped;
}

function getBaseUrl() {
  return window.location.href.split(/[?#]/)[0].replace(/index\.html$/, '');
}

function buildPostUrl(id) {
  if (id === undefined || id === null) return getBaseUrl();
  return `${getBaseUrl()}?post=${encodeURIComponent(id)}`;
}

function buildPostCard(post) {
  const card = document.createElement('article');
  card.className = 'post-card';

  const dateText = formatDate(post.created_at);
  const categoryText = post.category || '未分類';

  const header = document.createElement('div');
  header.className = 'post-header';

  if (dateText) {
    const date = document.createElement('p');
    date.className = 'post-date';
    date.textContent = dateText;
    header.appendChild(date);
  }

  const catBadge = document.createElement('span');
  catBadge.className = 'post-category';
  catBadge.textContent = '🏷️ ' + categoryText;
  header.appendChild(catBadge);

  card.appendChild(header);

  const titleText = post.title || '無題';
  const title = document.createElement('h3');
  title.textContent = titleText;
  card.appendChild(title);

  const allImages = parseImageUrls(post.image_url).map(safeImageUrl);
  const totalImages = allImages.length;

  const usedInline = new Set();
  for (const m of String(post.content || '').matchAll(/\[img=(\d+)\]/g)) {
    const index = parseInt(m[1], 10) - 1;
    if (allImages[index]) usedInline.add(index);
  }

  const imageUrls = allImages.filter((url, index) => url && !usedInline.has(index));
  const imageCaption = (index) => `${titleText}（${index + 1}/${totalImages}）`;

  function createImageButton(url, caption) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'image-button';
    button.setAttribute('aria-label', caption + ' を拡大表示');

    const img = document.createElement('img');
    img.src = url;
    img.alt = '';
    img.loading = 'lazy';
    img.draggable = false;

    img.addEventListener('error', () => {
      button.remove();
    });

    button.appendChild(img);

    button.addEventListener('click', () => {
      openLightbox(url, caption, button);
    });

    return button;
  }

  if (totalImages === 1 && imageUrls.length === 1) {
    card.appendChild(createImageButton(imageUrls[0], titleText));
  } else if (imageUrls.length > 0) {
    const gallery = document.createElement('div');
    gallery.className = 'image-gallery';

    allImages.forEach((url, index) => {
      if (!url || usedInline.has(index)) return;
      gallery.appendChild(createImageButton(url, imageCaption(index)));
    });

    card.appendChild(gallery);
  }

  const content = document.createElement('div');
  content.className = 'post-content';
  content.innerHTML = formatContentWithTags(post.content || '', { images: allImages });

  content.querySelectorAll('.inline-img-slot').forEach((slot) => {
    const index = parseInt(slot.dataset.img, 10);
    slot.replaceWith(createImageButton(allImages[index], imageCaption(index)));
  });

  card.appendChild(content);

  const shareArea = document.createElement('div');
  shareArea.className = 'share-area';

  const label = document.createElement('span');
  label.className = 'share-label';
  label.textContent = '✦ SHARE ✦';
  shareArea.appendChild(label);

  const currentUrl = buildPostUrl(post.id);

  const xBtn = document.createElement('a');
  xBtn.className = 'share-btn';
  xBtn.target = '_blank';
  xBtn.rel = 'noopener noreferrer';
  const xText = encodeURIComponent(`「${titleText}」 - KINOKO-BLOG`);
  xBtn.href = `https://twitter.com/intent/tweet?text=${xText}&url=${encodeURIComponent(currentUrl)}&hashtags=KINOKO_BLOG`;
  xBtn.innerHTML = '𝕏 Post';
  shareArea.appendChild(xBtn);

  const lineBtn = document.createElement('a');
  lineBtn.className = 'share-btn';
  lineBtn.target = '_blank';
  lineBtn.rel = 'noopener noreferrer';
  const lineText = encodeURIComponent(`「${titleText}」 - KINOKO-BLOG\n${currentUrl}`);
  lineBtn.href = `https://line.me/R/msg/text/?${lineText}`;
  lineBtn.innerHTML = '💬 LINE';
  shareArea.appendChild(lineBtn);

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'share-btn';
  copyBtn.innerHTML = '🔗 URLコピー';
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(currentUrl);
      copyBtn.innerHTML = '✨ コピーしたよ！';
      setTimeout(() => {
        copyBtn.innerHTML = '🔗 URLコピー';
      }, 2000);
    } catch (err) {
      console.error('コピー失敗:', err);
      window.prompt('このURLをコピーしてください', currentUrl);
    }
  });
  shareArea.appendChild(copyBtn);

  card.appendChild(shareArea);

  return card;
}

function setupFilters(posts) {
  const categories = new Set();
  const archives = new Set();

  posts.forEach((post) => {
    if (post.category) categories.add(post.category);
    const ym = formatYearMonth(post.created_at);
    if (ym) archives.add(ym);
  });

  categoryFilter.innerHTML = '<option value="all">すべて</option>';
  Array.from(categories).sort().forEach((cat) => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    categoryFilter.appendChild(opt);
  });

  archiveFilter.innerHTML = '<option value="all">全期間</option>';
  Array.from(archives).sort().reverse().forEach((ym) => {
    const opt = document.createElement('option');
    opt.value = ym;
    const [y, m] = ym.split('-');
    opt.textContent = `${y}年${m}月`;
    archiveFilter.appendChild(opt);
  });
}

function renderFilteredPosts() {
  const selectedCat = categoryFilter.value;
  const selectedArchive = archiveFilter.value;

  const filtered = allFetchedPosts.filter((post) => {
    const matchCat = (selectedCat === 'all') || (post.category === selectedCat);
    const matchArc = (selectedArchive === 'all') || (formatYearMonth(post.created_at) === selectedArchive);
    const matchDay = !selectedDay || (formatDay(post.created_at) === selectedDay);
    return matchCat && matchArc && matchDay;
  });

  if (filtered.length === 0) {
    showMessage('該当する投稿が見つかりませんでした 🪐', false);
    return;
  }

  const fragment = document.createDocumentFragment();
  sortNewestFirst(filtered).forEach((post) => {
    fragment.appendChild(buildPostCard(post));
  });

  container.replaceChildren(fragment);

  if (window.twttr && window.twttr.ready) {
    window.twttr.ready(function (twttr) {
      twttr.widgets.load(container);
    });
  }
}

const calendarBox = document.getElementById('calendar-box');
const calendarEl = document.getElementById('calendar');

let calendarYm = null;
let selectedDay = null;

function formatDay(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function archiveMonths() {
  return Array.from(archiveFilter.options)
    .map((opt) => opt.value)
    .filter((value) => value !== 'all');
}

function goToMonth(ym) {
  calendarYm = ym;
  selectedDay = null;
  archiveFilter.value = ym;
  renderCalendar();
  renderFilteredPosts();
}

function toggleDay(key) {
  selectedDay = (selectedDay === key) ? null : key;
  if (selectedDay) archiveFilter.value = calendarYm;
  renderCalendar();
  renderFilteredPosts();
}

function renderCalendar() {
  const months = archiveMonths();

  if (!months.length || !calendarYm) {
    calendarBox.hidden = true;
    return;
  }

  calendarBox.hidden = false;

  const [year, month] = calendarYm.split('-').map(Number);
  const selectedCat = categoryFilter.value;
  const counts = new Map();

  allFetchedPosts.forEach((post) => {
    if (selectedCat !== 'all' && post.category !== selectedCat) return;
    const day = formatDay(post.created_at);
    if (day) counts.set(day, (counts.get(day) || 0) + 1);
  });

  const index = months.indexOf(calendarYm);
  const newerYm = months[index - 1];
  const olderYm = months[index + 1];

  const head = document.createElement('div');
  head.className = 'cal-head';

  const prevBtn = document.createElement('button');
  prevBtn.type = 'button';
  prevBtn.className = 'cal-nav';
  prevBtn.textContent = '◀';
  prevBtn.setAttribute('aria-label', '前の記事がある月へ');
  prevBtn.disabled = !olderYm;
  prevBtn.addEventListener('click', () => goToMonth(olderYm));

  const title = document.createElement('div');
  title.className = 'cal-title';
  title.textContent = `${year}年${month}月`;

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.className = 'cal-nav';
  nextBtn.textContent = '▶';
  nextBtn.setAttribute('aria-label', '次の記事がある月へ');
  nextBtn.disabled = !newerYm;
  nextBtn.addEventListener('click', () => goToMonth(newerYm));

  head.append(prevBtn, title, nextBtn);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';

  ['日', '月', '火', '水', '木', '金', '土'].forEach((name, i) => {
    const cell = document.createElement('div');
    cell.className = 'cal-week' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
    cell.textContent = name;
    grid.appendChild(cell);
  });

  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const todayKey = formatDay(new Date());

  for (let i = 0; i < firstWeekday; i++) {
    grid.appendChild(document.createElement('div'));
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${calendarYm}-${String(day).padStart(2, '0')}`;
    const count = counts.get(key) || 0;
    const cell = document.createElement(count ? 'button' : 'div');

    cell.className = 'cal-day';
    cell.textContent = String(day);

    if (key === todayKey) cell.classList.add('today');

    if (count) {
      cell.type = 'button';
      cell.classList.add('has-posts');
      cell.setAttribute('aria-label', `${month}月${day}日の記事 ${count}件`);
      cell.setAttribute('aria-pressed', String(selectedDay === key));
      if (selectedDay === key) cell.classList.add('selected');
      cell.addEventListener('click', () => toggleDay(key));
    }

    grid.appendChild(cell);
  }

  const parts = [head, grid];

  if (selectedDay) {
    const [, selMonth, selDay] = selectedDay.split('-').map(Number);

    const status = document.createElement('p');
    status.className = 'cal-status';
    status.append(`${selMonth}月${selDay}日の記事を表示中`);

    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'cal-clear';
    clearBtn.textContent = '✕ 解除';
    clearBtn.addEventListener('click', () => toggleDay(selectedDay));

    status.appendChild(clearBtn);
    parts.push(status);
  }

  calendarEl.replaceChildren(...parts);
}

categoryFilter.addEventListener('change', () => {
  selectedDay = null;
  renderCalendar();
  renderFilteredPosts();
});

archiveFilter.addEventListener('change', () => {
  selectedDay = null;
  if (archiveFilter.value !== 'all') calendarYm = archiveFilter.value;
  renderCalendar();
  renderFilteredPosts();
});

function makeBackLink(extraClass) {
  const wrap = document.createElement('p');
  wrap.className = 'back-wrap ' + extraClass;

  const link = document.createElement('a');
  link.className = 'back-link';
  link.href = getBaseUrl();
  link.textContent = '📖 ほかの記事も見る';

  wrap.appendChild(link);
  return wrap;
}

function showSinglePost(posts, id) {
  document.querySelector('.filter-container').hidden = true;

  const post = posts.find((item) => String(item.id) === id);

  if (!post) {
    const message = document.createElement('p');
    message.className = 'message is-error';
    message.textContent = 'この記事は見つかりませんでした（削除されたか、非公開になったかも）';
    container.replaceChildren(message, makeBackLink('bottom'));
    return;
  }

  document.title = `${post.title || '無題'} - KINOKO-BLOG`;

  container.insertAdjacentElement('beforebegin', makeBackLink('top'));
  container.replaceChildren(buildPostCard(post), makeBackLink('bottom'));

  if (window.twttr && window.twttr.ready) {
    window.twttr.ready(function (twttr) {
      twttr.widgets.load(container);
    });
  }
}

const RECENT_POST_LIMIT = 20;

function renderRecentPosts(posts, currentId) {
  const widget = document.getElementById('recent-widget');
  const list = document.getElementById('recent-list');
  if (!widget || !list) return;

  const recent = sortNewestFirst(posts || []).slice(0, RECENT_POST_LIMIT);
  list.replaceChildren();

  recent.forEach((post) => {
    const item = document.createElement('li');
    const link = document.createElement('a');
    link.href = buildPostUrl(post.id);

    const titleText = post.title || '無題';
    link.title = titleText;

    if (currentId !== undefined && currentId !== null && String(post.id) === String(currentId)) {
      link.setAttribute('aria-current', 'page');
    }

    const date = document.createElement('span');
    date.className = 'recent-date';
    date.textContent = formatDate(post.created_at);

    const title = document.createElement('span');
    title.className = 'recent-title';
    title.textContent = titleText;

    link.appendChild(date);
    link.appendChild(title);
    item.appendChild(link);
    list.appendChild(item);
  });

  widget.hidden = recent.length === 0;
}

async function fetchPosts() {
  if (!supabaseClient) {
    showMessage('❌ データベースに接続できませんでした。時間をおいて再読み込みしてね', true);
    return;
  }

  let posts, error;

  try {
    ({ data: posts, error } = await supabaseClient
      .from('posts')
      .select('*')
      .or('is_published.is.null,is_published.eq.true'));
  } catch (err) {
    error = err;
  }

  if (error) {
    showMessage('❌ データの取得に失敗しました: ' + error.message, true);
    return;
  }

  renderRecentPosts(posts, requestedPostId);

  if (requestedPostId !== null) {
    showSinglePost(posts || [], requestedPostId);
    return;
  }

  if (!posts || posts.length === 0) {
    showMessage('まだ投稿がありません。', false);
    return;
  }

  allFetchedPosts = posts;
  setupFilters(allFetchedPosts);

  calendarYm = archiveMonths()[0] || null;
  renderCalendar();

  renderFilteredPosts();
}

(() => {
  const canvas = document.getElementById("spore-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  const IS_TOUCH = window.matchMedia("(hover: none), (pointer: coarse)").matches;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const FRAME_MS = IS_TOUCH ? 1000 / 30 : 0;
  let lastFrame = 0;

  let width = 0;
  let height = 0;
  let spores = [];
  let mouseX = 0;
  let mouseY = 0;
  let animationId = null;

  const colors = ["#ff7ad9", "#4de1ff", "#ffe84a", "#b68cff", "#b6ff5c"];

  const GLOW = {};
  const STAR = {};

  function glowSprite(color) {
    if (GLOW[color]) return GLOW[color];
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, color + "dd");
    grad.addColorStop(0.25, color + "77");
    grad.addColorStop(0.6, color + "22");
    grad.addColorStop(1, color + "00");
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return (GLOW[color] = c);
  }

  function starSprite(color) {
    if (STAR[color]) return STAR[color];
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    g.translate(32, 32);
    g.shadowColor = color;
    g.shadowBlur = 8;
    const grad = g.createRadialGradient(0, 0, 0, 0, 0, 26);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.3, color);
    grad.addColorStop(1, color + "bb");
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(0, -26);
    g.quadraticCurveTo(2.5, -2.5, 26, 0);
    g.quadraticCurveTo(2.5, 2.5, 0, 26);
    g.quadraticCurveTo(-2.5, 2.5, -26, 0);
    g.quadraticCurveTo(-2.5, -2.5, 0, -26);
    g.closePath();
    g.fill();
    return (STAR[color] = c);
  }

  function drawSpore(ctx, sp, x, y, advance) {
    if (advance) sp.tw += sp.twSpeed;
    const flash = Math.pow(0.5 + 0.5 * Math.sin(sp.tw), 3);
    const a = Math.min(1, sp.alpha + 0.25) * (0.3 + 0.7 * flash);

    if (sp.star) {
      const size = (9 + sp.size * 4.5) * (0.55 + 0.75 * flash);
      const halo = size * 1.6;
      ctx.globalAlpha = a * 0.55;
      ctx.drawImage(glowSprite(sp.color), x - halo, y - halo, halo * 2, halo * 2);
      ctx.globalAlpha = Math.min(1, a * 1.25);
      ctx.drawImage(starSprite(sp.color), x - size, y - size, size * 2, size * 2);
    } else {
      const halo = 5 + sp.size * 3.2 + flash * 7;
      ctx.globalAlpha = a * 0.8;
      ctx.drawImage(glowSprite(sp.color), x - halo, y - halo, halo * 2, halo * 2);
      ctx.globalAlpha = Math.min(1, a + 0.2);
      ctx.fillStyle = sp.color;
      ctx.beginPath();
      ctx.arc(x, y, sp.size * (0.8 + 0.5 * flash), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function createSpore(randomY = false) {
    return {
      x: Math.random() * width,
      y: randomY ? Math.random() * height : height + 10,
      size: Math.random() * 2.1 + 0.5,
      speed: Math.random() * 0.55 + 0.12,
      drift: (Math.random() - 0.5) * 0.45,
      alpha: Math.random() * 0.5 + 0.35,
      color: colors[Math.floor(Math.random() * colors.length)],
      phase: Math.random() * Math.PI * 2,
      tw: Math.random() * Math.PI * 2,
      twSpeed: 0.03 + Math.random() * 0.07,
      star: Math.random() < 0.2
    };
  }

  function render(advance) {
    ctx.clearRect(0, 0, width, height);
    ctx.globalCompositeOperation = "lighter";
    for (const spore of spores) {
      drawSpore(ctx, spore, spore.x + mouseX * 0.012, spore.y + mouseY * 0.012, advance);
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2);
    const prevWidth = width;

    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    if (!spores.length || width !== prevWidth) {
      const count = Math.min(180, Math.max(60, Math.floor((width * height) / 8500)));
      const total = IS_TOUCH ? Math.ceil(count * 0.6) : count;
      spores = Array.from({ length: total }, () => createSpore(true));
    }

    if (reduceMotion) render(false);
  }

  function animate(now) {
    if (document.hidden) { animationId = requestAnimationFrame(animate); return; }
    if (FRAME_MS && now - lastFrame < FRAME_MS) { animationId = requestAnimationFrame(animate); return; }
    lastFrame = now || 0;

    for (const spore of spores) {
      spore.phase += 0.015;
      spore.x += spore.drift + Math.sin(spore.phase) * 0.12;
      spore.y -= spore.speed;

      if (spore.y < -10) Object.assign(spore, createSpore(false));
      if (spore.x < -10) spore.x = width + 10;
      if (spore.x > width + 10) spore.x = -10;
    }

    render(true);
    animationId = requestAnimationFrame(animate);
  }

  function stopAnimation() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
  }

  function startAnimation() {
    stopAnimation();
    if (reduceMotion) render(false);
    else animationId = requestAnimationFrame(animate);
  }

  window.addEventListener("resize", () => {
    resize();
    startAnimation();
  }, { passive: true });

  window.addEventListener("mousemove", (event) => {
    mouseX = event.clientX - width / 2;
    mouseY = event.clientY - height / 2;
  }, { passive: true });

  resize();
  startAnimation();
})();

<script>
(() => {
  const link = document.querySelector(".page-back");
  const img = link && link.querySelector("img");
  if (!link || !img) return;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let audioCtx = null;

  function playBounceSound() {
    try {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;

      if (!audioCtx) audioCtx = new AudioCtor();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const t = audioCtx.currentTime;

      osc.type = "sine";
      osc.frequency.setValueAtTime(320, t);
      osc.frequency.exponentialRampToValueAtTime(850, t + 0.12);

      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(t + 0.18);
    } catch (e) {
    }
  }

  link.addEventListener("click", (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    const href = link.getAttribute("href");
    if (!href || href === "#" || reduceMotion) return;

    e.preventDefault();
    img.classList.remove("is-pop");
    void img.offsetWidth;
    img.classList.add("is-pop");

    playBounceSound();

    setTimeout(() => {
      window.location.href = href;
    }, 350);
  });
})();
</script>
