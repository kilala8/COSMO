  <title>🖍️ ( ´ᯅ` ) 🎨</title>

  <style>

rotate(8)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3Cg transform='translate(153 357) scale(1.9) rotate(22)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3Cg transform='translate(357 357) scale(1.9) rotate(-24)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    #background-image {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background-color: var(--bg);
      background-image:
        var(--neon-tile);
      background-repeat: repeat;
      background-position: center;
      background-size: 408px 408px;
    }

    #background-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
      will-change: transform;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      font-family:
        "MS Gothic",
        "ＭＳ ゴシック",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: transparent;
    }

    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: auto;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: calc(42vw + 160px);
      height: calc(42vw + 160px);
      min-width: 420px;
      min-height: 420px;
      border-radius: 50%;
      opacity: 0.16;
      animation: glow-drift 14s ease-in-out infinite alternate;
      will-change: transform;
    }

    .ambient::before {
      top: calc(-12% - 80px);
      left: calc(-10% - 80px);
      background: radial-gradient(
        circle closest-side,
        rgba(255, 105, 232, 1) 0%,
        rgba(255, 105, 232, 1) 45%,
        rgba(255, 105, 232, 0.5) 76%,
        rgba(255, 105, 232, 0) 100%
      );
    }

    .ambient::after {
      right: calc(-12% - 80px);
      bottom: calc(-15% - 80px);
      background: radial-gradient(
        circle closest-side,
        rgba(105, 234, 255, 1) 0%,
        rgba(105, 234, 255, 1) 45%,
        rgba(105, 234, 255, 0.5) 76%,
        rgba(105, 234, 255, 0) 100%
      );
      animation-delay: -6s;
    }

    @keyframes glow-drift {
      from {
        transform: translate(0, 0) scale(0.9);
      }
      to {
        transform: translate(10vw, 7vh) scale(1.15);
      }
    }

    #spores {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .spore {
      position: absolute;
      bottom: -15px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--spore-color);
      box-shadow: 0 0 9px var(--spore-color);
      opacity: 0;
      animation: spore-rise var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes spore-rise {
      0% {
        transform: translate3d(0, 0, 0) scale(0.6);
        opacity: 0;
      }
      12% {
        opacity: var(--opacity);
      }
      80% {
        opacity: var(--opacity);
      }
      100% {
        transform: translate3d(var(--drift), -110vh, 0) scale(1.2);
        opacity: 0;
      }
    }

    .star {
      position: absolute;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding: 42px 18px 35px;
    }

    header {
      position: relative;
      z-index: 3;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--blue);
      font-size: 11px;
      letter-spacing: 0.32em;
      text-shadow: 0 0 12px var(--blue);
    }

    .title-link {
      display: inline-block;
      position: relative;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .title-link:hover {
      transform: scale(1.05);
    }

    h1 {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .title-img {
      max-width: 100%;
      height: auto;
      max-height: 180px;
      object-fit: contain;
      animation: ultraSoftRainbowNeon 80s infinite ease-in-out;
    }

    .title-img.is-pop {
      animation: fluffy-bounce 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), ultraSoftRainbowNeon 80s infinite ease-in-out;
    }

    @keyframes fluffy-bounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.35) rotate(-3deg); }
      60%  { transform: scale(0.92) rotate(2deg); }
      80%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .logo-sparkle-particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 100;
      animation: pop-particle 0.6s ease-out forwards;
    }

    @keyframes pop-particle {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    @keyframes ultraSoftRainbowNeon {
      0%, 100% {
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #ff7ad9) drop-shadow(0 0 32px #ff3dc8);
        opacity: 0.95;
      }
      20% {
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #4de1ff) drop-shadow(0 0 32px #00eaff);
        opacity: 0.9;
      }
      40% {
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #b6ff5c) drop-shadow(0 0 32px #82ff28);
        opacity: 0.95;
      }
      60% {
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #ffe84a) drop-shadow(0 0 32px #ffcc00);
        opacity: 0.9;
      }
      80% {
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #b68cff) drop-shadow(0 0 32px #924dff);
        opacity: 0.95;
      }
    }

    .subtitle {
      margin: 17px 0 0;
      color: #e1d2f5;
      font-size: 13px;
      line-height: 2;
      letter-spacing: 0.06em;
    }

    .hint {
      margin: 14px 0 0;
      color: #a99ac8;
      font-size: 11px;
      letter-spacing: 0.14em;
    }

    .gallery {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: clamp(520px, 72vh, 800px);
      min-height: 520px;
      margin: 12px auto 0;
      isolation: isolate;
      overflow: hidden;
      overflow: clip;
      touch-action: none;
      border-radius: 16px;
    }

    .gallery-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .gallery-inner::before {
      content: "";
      position: absolute;
      inset: 7% 5%;
      border: 1px solid rgba(184, 138, 255, 0.12);
      border-radius: 48% 52% 43% 57% / 48% 43% 57% 52%;
      box-shadow:
        inset 0 0 65px rgba(142, 68, 255, 0.06),
        0 0 55px rgba(142, 68, 255, 0.06);
      pointer-events: none;
    }

    .gallery-inner::after {
      content: "✧  ·  ✦  ·  ✧";
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: -1;
      transform: translate(-50%, -50%);
      color: rgba(204, 169, 255, 0.15);
      font-size: clamp(32px, 6vw, 60px);
      letter-spacing: 0.6em;
      white-space: nowrap;
      pointer-events: none;
    }

    .art-orb {
      position: absolute;
      width: var(--diameter);
      height: var(--diameter);
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      cursor: grab;
      background:
        radial-gradient(circle at 30% 25%, #5d376f, #16102d 70%);
      box-shadow:
        0 0 8px rgba(255, 105, 232, 0.65),
        0 0 22px rgba(183, 138, 255, 0.4),
        inset 0 0 14px rgba(255, 255, 255, 0.18);
      transform: translate(-50%, -50%);
      transition:
        box-shadow 0.3s ease,
        border-color 0.3s ease,
        filter 0.3s ease;
      z-index: 2;
      touch-action: none;
    }

    .art-orb:active {
      cursor: grabbing;
    }

    .art-orb img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
      transition: transform 0.3s ease;
    }

    .art-orb:hover,
    .art-orb:focus-visible {
      z-index: 5;
      outline: none;
      border-color: #fff;
      box-shadow:
        0 0 12px #fff,
        0 0 25px var(--pink),
        0 0 48px var(--purple);
      filter: brightness(1.15);
    }

    .art-orb:hover img,
    .art-orb:focus-visible img {
      transform: scale(1.13);
    }

    .art-orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 50%;
      pointer-events: none;
    }

    .image-fallback {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 8px;
      color: #f6d9ff;
      font-size: 9px;
      line-height: 1.4;
      text-align: center;
      overflow-wrap: anywhere;
      background:
        radial-gradient(circle, rgba(255, 105, 232, 0.25), transparent 65%),
        #17102c;
    }

    .art-viewer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: rgba(5, 3, 18, 0.9);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      cursor: pointer;
      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .art-viewer.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .viewer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      max-height: 100%;
      transform: scale(0.94) translateY(12px);
      transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .art-viewer.is-open .viewer-content {
      transform: scale(1) translateY(0);
    }

    .art-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-height: calc(100vh - 155px);
      min-height: 100px;
    }

    #largeArt {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 155px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 5px;
      box-shadow:
        0 0 10px rgba(255, 255, 255, 0.12),
        0 0 35px rgba(255, 105, 232, 0.22),
        0 0 80px rgba(105, 234, 255, 0.12);
      animation: image-appear 0.45s ease both;
    }

    @keyframes image-appear {
      from {
        opacity: 0;
        transform: scale(0.97);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .viewer-fallback {
      display: none;
      padding: 35px 24px;
      color: #ffd4fb;
      text-align: center;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .art-caption {
      margin: 18px 0 0;
      color: #f5eaff;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-align: center;
      text-shadow: 0 0 12px var(--pink);
    }

    .art-number {
      margin: 8px 0 0;
      color: #a99bc8;
      font-size: 10px;
      letter-spacing: 0.2em;
    }

    footer {
      position: relative;
      z-index: 3;
      padding: 20px 0 25px;
      text-align: center;
    }

    .footer-note {
      margin-top: 10px;
      color: #9382ae;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    @media (max-width: 600px) {
      .page {
        padding: 32px 10px 25px;
      }

      .subtitle {
        font-size: 12px;
      }

      .gallery {
        height: 520px;
        min-height: 480px;
        margin-top: 8px;
      }

      .gallery-inner::before {
        inset: 5% 0;
      }

      .art-viewer {
        padding: 40px 12px 24px;
      }

      .art-frame,
      #largeArt {
        max-height: calc(100dvh - 150px);
      }

      .art-caption {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
@media (hover: none), (pointer: coarse) {
  *, *::before, *::after {
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
}
.art-orb { will-change: transform; }

@media (hover: none), (pointer: coarse) {
  .title-img {
    animation: none;
    filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #ff7ad9) drop-shadow(0 0 32px #ff3dc8);
    opacity: 0.95;
  }
  .title-img.is-pop {
    animation: fluffy-bounce 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
}
</style>
</head>

<body>
  <div id="background-image"></div>
  <div id="background-wrap">
    <div class="ambient" aria-hidden="true"></div>
    <div id="spores" aria-hidden="true"></div>
  </div>

  <main class="page">
    <header>
      <p class="eyebrow">KOKO WASHI NO HUNGI TENGOKU</p>
      <a href="index.html" class="title-link" id="logoLink">
        <h1><img src="1_s_files/illust.webp" alt="🖍️ ( ´ᯅ` ) 🎨" class="title-img" id="logoImg"></h1>
      </a>

      <p class="subtitle">
        絵置き場です( ´ᯅ` )🎨<br>
        玉を転がしてみてね〜💫
      </p>

      <p class="hint">✧ THROW &amp; ROLL THE BALLS ✧</p>
    </header>

    <section
      class="gallery"
      id="gallery"
      aria-label="作品一覧"
    >
      <div class="gallery-inner" id="galleryInner"></div>
    </section>

    <footer>
      <p class="footer-note">
        made of tiny spores &amp; STRANGE MATTARI THINGS ✧
      </p>
    </footer>
  </main>

  <div
    class="art-viewer"
    id="artViewer"
    role="dialog"
    aria-modal="true"
    aria-label="でかく表示（クリックで閉じる）"
    aria-hidden="true"
  >
    <div class="viewer-content">
      <div class="art-frame">
        <img id="largeArt" src="" alt="">
        <div class="viewer-fallback" id="viewerFallback">
          🌎( ´ᯅ`；)絵が見つかりません……！<br>
        </div>
      </div>

      <p class="art-caption" id="artCaption"></p>
      <p class="art-number" id="artNumber"></p>
    </div>
  </div>

  <script>
    "use strict";

    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
    }, false);

    document.addEventListener("dragstart", (e) => {
      if (e.target.tagName === "IMG") {
        e.preventDefault();
      }
    }, false);

    const artworks = [
      { thumbnail: "1_b_art/dks.webp", image: "1_a_art/dekame.webp", title: "でか目ちゃん" },
      { thumbnail: "1_b_art/fas.webp", image: "1_a_art/famoi.webp", title: "ふぇもいちゃん" },
      { thumbnail: "1_b_art/h2s.webp", image: "1_a_art/ht2.webp", title: "フラワー鳥まんじゅう2号" },
      { thumbnail: "1_b_art/hts.webp", image: "1_a_art/ht.webp", title: "フラワー鳥まんじゅう" },
      { thumbnail: "1_b_art/ins.webp", image: "1_a_art/inaiko.webp", title: "いない子" },
      { thumbnail: "1_b_art/jns.webp", image: "1_a_art/jane.webp", title: "じぇいんちゃん" },
      { thumbnail: "1_b_art/khs.webp", image: "1_a_art/kuragehead.webp", title: "くらげあたまちゃん" },
      { thumbnail: "1_b_art/krs.webp", image: "1_a_art/kurages.webp", title: "くらげ親子" },
      { thumbnail: "1_b_art/mds.webp", image: "1_a_art/medama.webp", title: "めんたま" },
      { thumbnail: "1_b_art/nks.webp", image: "1_a_art/neki.webp", title: "おねいさん" },
      { thumbnail: "1_b_art/ods.webp", image: "1_a_art/oddeye.webp", title: "オッドアイちゃん" },
      { thumbnail: "1_b_art/prs.webp", image: "1_a_art/primary0.webp", title: "プライマリーゼロちゃん" },
      { thumbnail: "1_b_art/tas.webp", image: "1_a_art/tama.webp", title: "たまちゃん" },
      { thumbnail: "1_b_art/tms.webp", image: "1_a_art/tempa.webp", title: "天パちゃん" },
      { thumbnail: "1_b_art/ums.webp", image: "1_a_art/uma2ra.webp", title: "ウマヅラさん" },
      { thumbnail: "1_b_art/yms.webp", image: "1_a_art/yamiko.webp", title: "病み子" },
      { thumbnail: "1_b_art/yrs.webp", image: "1_a_art/yuriko.webp", title: "ゆりこちゃん" },
      { thumbnail: "1_b_art/bomb.webp", image: "1_a_art/bomb.webp", title: "ボンバーマンもどき" },
      { thumbnail: "1_b_art/boy.webp", image: "1_a_art/boy.webp", title: "わ○さ生活（仮）" },
      { thumbnail: "1_b_art/ho4ko.webp", image: "1_a_art/ho4ko.webp", title: "星子ちゃん" },
      { thumbnail: "1_b_art/jigazo1.webp", image: "1_a_art/jigazo1.webp", title: "500億倍美化自画像１" },
      { thumbnail: "1_b_art/jigazo2.webp", image: "1_a_art/jigazo2.webp", title: "500億倍美化自画像２" },
      { thumbnail: "1_b_art/jigazo3.webp", image: "1_a_art/jigazo3.webp", title: "500億倍美化自画像３" },
      { thumbnail: "1_b_art/jigazo4.webp", image: "1_a_art/jigazo4.webp", title: "500億倍美化自画像４" },
      { thumbnail: "1_b_art/mayuko.webp", image: "1_a_art/mayuko.webp", title: "まゆ子たち" },
      { thumbnail: "1_b_art/yoru.webp", image: "1_a_art/yoru.webp", title: "夜子ちゃん" },
      { thumbnail: "1_b_art/foo.webp", image: "1_a_art/foo.webp", title: "フードちゃん" },
      { thumbnail: "1_b_art/BB.webp", image: "1_a_art/BB.webp", title: "BB" },
      { thumbnail: "1_b_art/hebi.webp", image: "1_a_art/hebi.webp", title: "ヨルムンガンドちゃん" },
      { thumbnail: "1_b_art/inori.webp", image: "1_a_art/inori.webp", title: "いのりちゃん" },
      { thumbnail: "1_b_art/jiko.webp", image: "1_a_art/jiko.webp", title: "事故ちゃん" },
      { thumbnail: "1_b_art/juke2.webp", image: "1_a_art/juke2.webp", title: "充血ちゃん" },
      { thumbnail: "1_b_art/kurage.webp", image: "1_a_art/kurage.webp", title: "くらげちゃん" },
      { thumbnail: "1_b_art/miteruyo.webp", image: "1_a_art/miteruyo.webp", title: "みてるよ。" },
      { thumbnail: "1_b_art/null.webp", image: "1_a_art/null.webp", title: "ぬる坊" },
    ];

    const sporeColors = [
      "#ff69e8",
      "#69eaff",
      "#c59aff",
      "#fff0ff"
    ];

    const isTouchDevice = window.matchMedia("(hover: none), (pointer: coarse)").matches;
    const SPORE_COUNT = isTouchDevice ? 20 : 42;
    const STAR_COUNT = isTouchDevice ? 45 : 100;

    const sporesContainer = document.getElementById("spores");

    for (let i = 0; i < SPORE_COUNT; i++) {
      const spore = document.createElement("span");
      spore.className = "spore";

      spore.style.left = Math.random() * 100 + "%";

      spore.style.setProperty(
        "--size",
        (2 + Math.random() * 4) + "px"
      );

      spore.style.setProperty(
        "--duration",
        (12 + Math.random() * 22) + "s"
      );

      spore.style.setProperty(
        "--delay",
        (-Math.random() * 30) + "s"
      );

      spore.style.setProperty(
        "--drift",
        (Math.random() * 150 - 75) + "px"
      );

      spore.style.setProperty(
        "--opacity",
        (0.25 + Math.random() * 0.55).toFixed(2)
      );

      spore.style.setProperty(
        "--spore-color",
        sporeColors[
          Math.floor(Math.random() * sporeColors.length)
        ]
      );

      sporesContainer.appendChild(spore);
    }

    const bgWrap = document.getElementById("background-wrap");
    const NEON_COLORS = ['#ff7ad9', '#4de1ff', '#ffe84a', '#b68cff'];

    for (let i = 0; i < STAR_COUNT; i++) {
      const star = document.createElement("div");
      star.classList.add("star");

      const color = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];

      star.style.background = color;
      star.style.boxShadow = `0 0 6px ${color}`;
      star.style.width = star.style.height = (Math.random() * 2 + 1) + "px";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";

      bgWrap.appendChild(star);
    }

    (() => {
      let targetX = 0;
      let targetY = 0;
      let currentParallaxX = 0;
      let currentParallaxY = 0;
      let parallaxRaf = null;

      function step() {
        currentParallaxX += (targetX - currentParallaxX) * 0.15;
        currentParallaxY += (targetY - currentParallaxY) * 0.15;

        bgWrap.style.transform =
          `translate3d(${currentParallaxX.toFixed(2)}px, ${currentParallaxY.toFixed(2)}px, 0)`;

        if (
          Math.abs(targetX - currentParallaxX) > 0.05 ||
          Math.abs(targetY - currentParallaxY) > 0.05
        ) {
          parallaxRaf = requestAnimationFrame(step);
        } else {
          parallaxRaf = null;
        }
      }

      document.addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse") return;

        targetX = -(e.clientX / window.innerWidth - 0.5) * 30;
        targetY = -(e.clientY / window.innerHeight - 0.5) * 30;

        if (!parallaxRaf) parallaxRaf = requestAnimationFrame(step);
      }, { passive: true });
    })();

    const gallery = document.getElementById("gallery");
    const galleryInner = document.getElementById("galleryInner");
    const viewer = document.getElementById("artViewer");
    const largeArt = document.getElementById("largeArt");
    const viewerFallback = document.getElementById("viewerFallback");
    const artCaption = document.getElementById("artCaption");
    const artNumber = document.getElementById("artNumber");

    let lastFocusedElement = null;
    let viewerOpenedAt = 0;
    let balls = [];
    let physicsRunning = false;

    const SPARKLE_MARKS = ["✦", "✧", "✨"];

    function attachSparkle(element) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      function sparkle() {
        const rect = element.getBoundingClientRect();
        const spark = document.createElement("span");

        spark.textContent =
          SPARKLE_MARKS[Math.floor(Math.random() * SPARKLE_MARKS.length)];

        const sparkLeft = rect.left + window.scrollX + Math.random() * rect.width;
        const sparkTop = rect.top + window.scrollY + Math.random() * rect.height;

        Object.assign(spark.style, {
          position: "absolute",
          left: sparkLeft + "px",
          top: sparkTop + "px",
          zIndex: "9999",
          pointerEvents: "none",
          color: NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)],
          fontSize: (9 + Math.random() * 10) + "px",
          textShadow: "0 0 8px currentColor",
          opacity: "1",
          transition: "transform 750ms ease-out, opacity 750ms ease-out"
        });

        document.body.appendChild(spark);

        requestAnimationFrame(() => {
          const dx = (Math.random() - 0.5) * 44;
          const dy = -(18 + Math.random() * 32);
          const rot = (Math.random() - 0.5) * 180;
          spark.style.transform =
            `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.4)`;
          spark.style.opacity = "0";
        });

        window.setTimeout(() => spark.remove(), 800);
      }

      let timer = null;

      function stop() {
        if (timer) {
          window.clearInterval(timer);
          timer = null;
        }
      }

      element.addEventListener("pointerenter", (e) => {
        if (e.pointerType !== "mouse" || timer) return;
        sparkle();
        timer = window.setInterval(sparkle, 90);
      });

      element.addEventListener("pointerleave", stop);
      element.addEventListener("pointercancel", stop);
    }

    function initPhysicsGallery() {
      galleryInner.replaceChildren();
      balls = [];

      const gWidth = gallery.clientWidth || 800;
      const gHeight = gallery.clientHeight || 560;

      const diameters = artworks.map(() => 54 + Math.random() * 28);
      
      for (let i = 0; i < artworks.length; i++) {
        const d = diameters[i];
        const r = d / 2;
        let x = r + 20 + Math.random() * (gWidth - d - 40);
        let y = r + 20 + Math.random() * (gHeight - d - 40);

        for (let t = 0; t < 20; t++) {
          let overlap = false;
          for (let b of balls) {
            if (Math.hypot(x - b.x, y - b.y) < r + b.r + 10) {
              overlap = true;
              break;
            }
          }
          if (!overlap) break;
          x = r + 20 + Math.random() * (gWidth - d - 40);
          y = r + 20 + Math.random() * (gHeight - d - 40);
        }

        const button = document.createElement("button");
        button.type = "button";
        button.className = "art-orb";
        button.style.width = d + "px";
        button.style.height = d + "px";
        button.setAttribute("aria-label", artworks[i].title + " を大きく表示");

        const img = document.createElement("img");
        img.src = artworks[i].thumbnail;
        img.alt = "";
        img.decoding = "async";

        const fallback = document.createElement("span");
        fallback.className = "image-fallback";
        fallback.textContent = "🪐\n画像";

        img.addEventListener("error", () => {
          img.style.display = "none";
          fallback.style.display = "flex";
        });

        button.appendChild(img);
        button.appendChild(fallback);

        let clickStartTime = 0;
        let startPointerX = 0;
        let startPointerY = 0;
        let maxMoved = 0;

        button.addEventListener("pointerdown", (e) => {
          if (viewer.classList.contains("is-open")) return;
          button.setPointerCapture(e.pointerId);
          b.isDragging = true;
          startPhysics();
          b.dragOffsetX = 0;
          b.dragOffsetY = 0;
          clickStartTime = performance.now();
          startPointerX = e.clientX;
          startPointerY = e.clientY;
          maxMoved = 0;
          b.vx = 0;
          b.vy = 0;
          e.stopPropagation();
        });

        button.addEventListener("pointermove", (e) => {
          if (!b.isDragging) return;
          maxMoved = Math.max(
            maxMoved,
            Math.hypot(e.clientX - startPointerX, e.clientY - startPointerY)
          );
          const rect = gallery.getBoundingClientRect();
          const targetX = e.clientX - rect.left;
          const targetY = e.clientY - rect.top;
          
          b.vx = (targetX - b.x) * 0.4;
          b.vy = (targetY - b.y) * 0.4;
          b.x = targetX;
          b.y = targetY;
        });

        const endDrag = (e) => {
          if (!b.isDragging) return;
          b.isDragging = false;
          try { button.releasePointerCapture(e.pointerId); } catch(err) {}

          if (e.type === "pointercancel") return;

          const elapsed = performance.now() - clickStartTime;
          const tapSlop = e.pointerType === "mouse" ? 8 : 16;

          if (maxMoved < tapSlop && elapsed < 800) {
            openArtwork(i, button);
          }
        };

        button.addEventListener("pointerup", endDrag);
        button.addEventListener("pointercancel", endDrag);

        attachSparkle(button);
        galleryInner.appendChild(button);

        const b = {
          index: i,
          element: button,
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          r: r,
          mass: r * r,
          isDragging: false
        };

        balls.push(b);
      }

      startPhysics();
    }

    function startPhysics() {
      if (physicsRunning) return;
      physicsRunning = true;
      requestAnimationFrame(updatePhysics);
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) startPhysics();
    });

    function updatePhysics() {
      if (document.hidden || viewer.classList.contains("is-open")) {
        physicsRunning = false;
        return;
      }

      let active = false;
      const gWidth = gallery.clientWidth || 800;
      const gHeight = gallery.clientHeight || 560;
      const damping = 0.985;
      const bounce = 0.75;

      for (let i = 0; i < balls.length; i++) {
        let b = balls[i];

        if (!b.isDragging) {
          if (Math.abs(b.vx) < 0.02) b.vx = 0;
          if (Math.abs(b.vy) < 0.02) b.vy = 0;
          if (b.vx !== 0 || b.vy !== 0) active = true;

          b.x += b.vx;
          b.y += b.vy;
          b.vx *= damping;
          b.vy *= damping;

          if (b.x - b.r < 0) {
            b.x = b.r;
            b.vx = -b.vx * bounce;
          } else if (b.x + b.r > gWidth) {
            b.x = gWidth - b.r;
            b.vx = -b.vx * bounce;
          }
          if (b.y - b.r < 0) {
            b.y = b.r;
            b.vy = -b.vy * bounce;
          } else if (b.y + b.r > gHeight) {
            b.y = gHeight - b.r;
            b.vy = -b.vy * bounce;
          }
        }
      }

      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          let b1 = balls[i];
          let b2 = balls[j];

          let dx = b2.x - b1.x;
          let dy = b2.y - b1.y;
          let dist = Math.hypot(dx, dy);
          let minDist = b1.r + b2.r;

          if (dist < minDist && dist > 0) {
            active = true;
            let overlap = minDist - dist;
            let nx = dx / dist;
            let ny = dy / dist;

            let totalMass = b1.mass + b2.mass;
            if (!b1.isDragging && !b2.isDragging) {
              b1.x -= nx * overlap * (b2.mass / totalMass);
              b1.y -= ny * overlap * (b2.mass / totalMass);
              b2.x += nx * overlap * (b1.mass / totalMass);
              b2.y += ny * overlap * (b1.mass / totalMass);
            } else if (b1.isDragging) {
              b2.x += nx * overlap;
              b2.y += ny * overlap;
            } else if (b2.isDragging) {
              b1.x -= nx * overlap;
              b1.y -= ny * overlap;
            }

            let kx = b1.vx - b2.vx;
            let ky = b1.vy - b2.vy;
            let p = 2 * (nx * kx + ny * ky) / totalMass;

            if (!b1.isDragging) {
              b1.vx -= p * b2.mass * nx * bounce;
              b1.vy -= p * b2.mass * ny * bounce;
            }
            if (!b2.isDragging) {
              b2.vx += p * b1.mass * nx * bounce;
              b2.vy += p * b1.mass * ny * bounce;
            }
          }
        }
      }

      for (let i = 0; i < balls.length; i++) {
        let b = balls[i];
        if (b.isDragging) active = true;

        if (b.drawX !== b.x || b.drawY !== b.y) {
          b.element.style.transform = `translate(${b.x}px, ${b.y}px) translate(-50%, -50%)`;
          b.drawX = b.x;
          b.drawY = b.y;
        }
      }

      if (active) {
        requestAnimationFrame(updatePhysics);
      } else {
        physicsRunning = false;
      }
    }

    function openArtwork(index, sourceButton) {
      const art = artworks[index];
      lastFocusedElement = sourceButton;

      largeArt.style.display = "block";
      viewerFallback.style.display = "none";

      largeArt.removeAttribute("src");
      largeArt.src = art.image;
      largeArt.alt = art.title;

      artCaption.textContent = art.title;

      artNumber.textContent =
        "SPORE " +
        String(index + 1).padStart(2, "0") +
        " / " +
        String(artworks.length).padStart(2, "0");

      viewerOpenedAt = performance.now();
      viewer.classList.add("is-open");
      viewer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeArtwork() {
      viewer.classList.remove("is-open");
      viewer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      startPhysics();

      if (lastFocusedElement) {
        lastFocusedElement.focus({ preventScroll: true });
      }
    }

    largeArt.addEventListener("error", () => {
      largeArt.style.display = "none";
      viewerFallback.style.display = "block";
    });

    largeArt.addEventListener("load", () => {
      largeArt.style.display = "block";
      viewerFallback.style.display = "none";
    });

    viewer.addEventListener("click", () => {
      if (performance.now() - viewerOpenedAt < 400) return;
      closeArtwork();
    });

    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        viewer.classList.contains("is-open")
      ) {
        closeArtwork();
      }
    });

    (() => {
      const logoLink = document.getElementById("logoLink");
      const logoImg = document.getElementById("logoImg");

      if (!logoLink || !logoImg) return;

      function playBounceSound() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';

          osc.frequency.setValueAtTime(320, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.12);

          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + 0.18);
        } catch (e) {
        }
      }

      function createLogoSparkles(rect) {
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const colors = ['#ffe84a', '#ff7ad9', '#4de1ff', '#b6ff5c', '#ffffff'];

        for (let i = 0; i < 14; i++) {
          const p = document.createElement('div');
          p.className = 'logo-sparkle-particle';
          
          const size = Math.random() * 8 + 4;
          p.style.width = size + 'px';
          p.style.height = size + 'px';
          p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          p.style.left = centerX + 'px';
          p.style.top = centerY + 'px';

          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 70 + 30;
          p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
          p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');

          document.body.appendChild(p);
          setTimeout(() => p.remove(), 600);
        }
      }

      logoLink.addEventListener("click", (e) => {
        const href = logoLink.getAttribute("href");
        if (href && href !== "#") {
          e.preventDefault();

          logoImg.classList.remove("is-pop");
          void logoImg.offsetWidth; 
          logoImg.classList.add("is-pop");

          playBounceSound();
          createLogoSparkles(logoImg.getBoundingClientRect());

          setTimeout(() => {
            window.location.href = href;
          }, 350);
        }
      });
    })();

    attachSparkle(document.querySelector(".title-link"));

    initPhysicsGallery();

    let lastWidth = window.innerWidth;
    let resizeTimer = null;

    window.addEventListener("resize", () => {
      window.clearTimeout(resizeTimer);

      resizeTimer = window.setTimeout(() => {
        if (window.innerWidth !== lastWidth) {
          lastWidth = window.innerWidth;
          initPhysicsGallery();
        }
      }, 200);
    });
  </script>
