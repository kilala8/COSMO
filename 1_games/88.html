 style='--c:%23030305;--e:%23743863'%3E%3Cuse href='%23p'/%3E%3Cg fill='%23743863'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3C/g%3E%3Cg transform='translate(357 153) scale(1.9) rotate(24)' style='--c:%23214c59;--e:%232b6274'%3E%3Cuse href='%23p'/%3E%3C/g%3E%3Cg transform='translate(51 255) scale(1.9) rotate(16)' style='--c:%23592b4c;--e:%23743863'%3E%3Cuse href='%23p'/%3E%3C/g%3E%3Cg transform='translate(153 255) scale(1.9) rotate(-20)' style='--c:%23030305;--e:%232b6274'%3E%3Cuse href='%23p'/%3E%3Cg fill='%232b6274'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3C/g%3E%3Cg transform='translate(255 255) scale(1.9) rotate(8)' style='--c:%232c5943;--e:%23397457'%3E%3Cuse href='%23p'/%3E%3C/g%3E%3Cg transform='translate(357 255) scale(1.9) rotate(-12)' style='--c:%23030305;--e:%23746d30'%3E%3Cuse href='%23p'/%3E%3Cg fill='%23746d30'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3C/g%3E%3Cg transform='translate(51 357) scale(1.9) rotate(-14)' style='--c:%23030305;--e:%23397457'%3E%3Cuse href='%23p'/%3E%3Cg fill='%23397457'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3C/g%3E%3Cg transform='translate(153 357) scale(1.9) rotate(22)' style='--c:%23595425;--e:%23746d30'%3E%3Cuse href='%23p'/%3E%3C/g%3E%3Cg transform='translate(255 357) scale(1.9) rotate(10)' style='--c:%23030305;--e:%23743863'%3E%3Cuse href='%23p'/%3E%3Cg fill='%23743863'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3C/g%3E%3Cg transform='translate(357 357) scale(1.9) rotate(-24)' style='--c:%23214c59;--e:%232b6274'%3E%3Cuse href='%23p'/%3E%3C/g%3E%3C/g%3E%3Cg fill='%23030305'%3E%3Cg transform='translate(51 51) scale(1.9) rotate(-22)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3Cg transform='translate(255 51) scale(1.9) rotate(-8)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3Cg transform='translate(153 153) scale(1.9) rotate(-18)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3Cg transform='translate(357 153) scale(1.9) rotate(24)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3Cg transform='translate(51 255) scale(1.9) rotate(16)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3Cg transform='translate(255 255) scale(1.9) rotate(8)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3Cg transform='translate(153 357) scale(1.9) rotate(22)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3Cg transform='translate(357 357) scale(1.9) rotate(-24)'%3E%3Cuse href='%23d'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

        * { box-sizing: border-box; }

        body {
            background-color: #000;
            background-image: var(--neon-tile);
            background-repeat: repeat;
            background-attachment: fixed;
            background-position: center;
            background-size: 408px 408px;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: sans-serif;
        }

        img {
            -webkit-user-drag: none;
            user-select: none;
        }

        .title {
            position: fixed;
            top: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 28px;
            color: #fff;
            text-shadow: 0 0 15px #ff7ad9, 0 0 30px #4de1ff;
            font-weight: bold;
            letter-spacing: 0.2em;
            z-index: 101;
            pointer-events: none;
        }

        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 102;
            padding: 10px 26px;
            font-size: 18px;
            font-weight: bold;
            color: var(--back-text);
            text-decoration: none;
            white-space: nowrap;
            background: var(--back-bg);
            border: 2px solid var(--back-border);
            border-radius: 999px;
            box-shadow: 0 0 12px #ff7ad9, inset 0 0 8px #ff7ad9;
            text-shadow: 0 0 8px #4de1ff;
            transition: transform 0.1s ease, background 0.2s, box-shadow 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 122, 217, 0.45);
            box-shadow: 0 0 22px #ff7ad9, 0 0 12px #4de1ff;
        }

        .back-btn:active {
            transform: scale(0.94);
        }

        #mycelium,
        #spore-canvas,
        #stars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #mycelium {
            z-index: 0;
            opacity: 0.3;
            background:
                radial-gradient(ellipse at 15% 25%, #642cff33, transparent 45%),
                radial-gradient(ellipse at 85% 65%, #ff36bd22, transparent 45%),
                radial-gradient(ellipse at 50% 90%, #00eaff1a, transparent 40%);
            animation: myceliumGlow 9s ease-in-out infinite alternate;
        }

        #spore-canvas { z-index: 1; }
        #stars { z-index: 1; }

        @keyframes myceliumGlow {
            from { opacity: 0.18; }
            to { opacity: 0.48; }
        }

        @media (hover: none), (pointer: coarse) {
            *, *::before, *::after {
                -webkit-backdrop-filter: none !important;
                backdrop-filter: none !important;
            }
        }

        #eyebrow-btn {
            position: fixed;
            width: 120px;
            height: auto;
            left: calc(50% - 60px);
            top: 40%;
            cursor: pointer;
            z-index: 100;
            filter: drop-shadow(0 0 15px #ff7ad9) drop-shadow(0 0 30px #4de1ff);
            transition: left 0.4s ease, top 0.4s ease;
        }

        #eyebrow-btn.shake {
            animation: tiltShake 0.4s ease-in-out;
        }

        @keyframes tiltShake {
            0%   { transform: rotate(0deg) scale(1); }
            15%  { transform: rotate(-12deg) scale(1.1); }
            30%  { transform: rotate(10deg) scale(1.1); }
            45%  { transform: rotate(-8deg) scale(1.05); }
            60%  { transform: rotate(6deg) scale(1.05); }
            75%  { transform: rotate(-3deg) scale(1.02); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .pop-spawn {
            position: fixed;
            max-width: 40vw;
            max-height: 40vh;
            pointer-events: none;
            z-index: 90;
            filter: drop-shadow(0 0 12px #ff7ad9);
            animation: popBounce 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popBounce {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) translate(0, 0) scale(0.2) rotate(0deg);
            }
            25% {
                opacity: 1;
                transform: translate(-50%, -50%) translate(calc(var(--tx) * 0.7), calc(var(--ty) * 0.7)) scale(1.15) rotate(calc(var(--rot) * 0.5));
            }
            45% {
                transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot));
            }
            75% {
                opacity: 1;
                transform: translate(-50%, -50%) translate(var(--tx), calc(var(--ty) + 10px)) scale(1) rotate(var(--rot));
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translate(var(--tx), calc(var(--ty) + 30px)) scale(0.8) rotate(calc(var(--rot) + 10deg));
            }
        }

<body>

    <div id="mycelium" aria-hidden="true"></div>
    <div id="stars" aria-hidden="true"></div>
    <canvas id="spore-canvas" aria-hidden="true"></canvas>

    <a class="back-btn" href="../game.html">( 👁️ _ 👁️ ) 戻る❓</a>

    <img id="eyebrow-btn" src="../1_g_files/mayu/mayu0.webp" alt="眉ボタン">

    <script>
        "use strict";

        document.addEventListener("contextmenu", (e) => {
          e.preventDefault();
        });

        document.addEventListener("dragstart", (e) => {
          if (e.target.tagName === "IMG") {
            e.preventDefault();
          }
        });

        const EYEBROW_IMAGES = Array.from({ length: 6 }, (_, i) => `../1_g_files/mayu/mayu${i}.webp`);

        const SPAWN_IMAGES = Array.from({ length: 27 }, (_, i) => `../1_g_files/sm/sm${i + 1}.webp`);

        const RANDOM_COUNT = 6;

        const MARGIN = 10;
        const TOP_MARGIN = 80;

        function preloadImages(list) {
            list.forEach((src) => {
                const img = new Image();
                img.onerror = () => console.warn('読み込み失敗:', src);
                img.src = src;
            });
        }

        class EyebrowColor {
            constructor(count) {
                this.count = count;
                this.lastIndex = 0;
                this.queue = [];
            }

            buildCycle() {
                const max = this.count - 1;
                const seq = [];

                for (let i = 0; i <= max; i++) seq.push(i);
                if (seq[0] === this.lastIndex) seq.shift();

                for (let i = max - 1; i >= 0; i--) seq.push(i);

                let prev = seq[seq.length - 1];
                for (let n = 0; n < RANDOM_COUNT; n++) {
                    let r;
                    do {
                        r = Math.floor(Math.random() * this.count);
                    } while (r === prev);
                    seq.push(r);
                    prev = r;
                }
                return seq;
            }

            next() {
                if (this.queue.length === 0) this.queue = this.buildCycle();
                this.lastIndex = this.queue.shift();
                return this.lastIndex;
            }
        }

        class PopSpawner {
            constructor(images) {
                this.images = images;
                this.currentIndex = 0;
            }

            spawn(fromX, fromY) {
                const img = document.createElement('img');
                img.src = this.images[this.currentIndex];
                img.className = 'pop-spawn';
                img.style.left = `${fromX}px`;
                img.style.top = `${fromY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 150;
                let targetX = fromX + Math.cos(angle) * distance;
                let targetY = fromY + Math.sin(angle) * distance;
                targetX = Math.min(Math.max(targetX, 60), window.innerWidth - 60);
                targetY = Math.min(Math.max(targetY, TOP_MARGIN), window.innerHeight - 60);

                img.style.setProperty('--tx', `${targetX - fromX}px`);
                img.style.setProperty('--ty', `${targetY - fromY}px`);
                img.style.setProperty('--rot', `${(Math.random() - 0.5) * 60}deg`);

                document.body.appendChild(img);

                img.addEventListener('animationend', () => img.remove());
                img.addEventListener('error', () => {
                    console.warn('読み込み失敗:', img.getAttribute('src'));
                    img.remove();
                });

                this.currentIndex = (this.currentIndex + 1) % this.images.length;
            }
        }

        class EyebrowButton {
            constructor(element, images, spawner) {
                this.element = element;
                this.images = images;
                this.spawner = spawner;
                this.color = new EyebrowColor(images.length);

                this.element.src = images[0];
                this.element.addEventListener('click', () => this.handleClick());
            }

            moveTo(left, top) {
                this.element.style.left = `${left}px`;
                this.element.style.top = `${top}px`;
            }

            moveRandom() {
                const w = this.element.offsetWidth;
                const h = this.element.offsetHeight;
                const maxLeft = Math.max(MARGIN, window.innerWidth - w - MARGIN);
                const maxTop = Math.max(TOP_MARGIN, window.innerHeight - h - MARGIN);
                this.moveTo(
                    MARGIN + Math.random() * (maxLeft - MARGIN),
                    TOP_MARGIN + Math.random() * (maxTop - TOP_MARGIN)
                );
            }

            handleClick() {
                this.element.classList.remove('shake');
                void this.element.offsetWidth;
                this.element.classList.add('shake');

                const rect = this.element.getBoundingClientRect();
                this.spawner.spawn(rect.left + rect.width / 2, rect.top + rect.height / 2);

                this.element.src = this.images[this.color.next()];

                this.moveRandom();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            preloadImages(EYEBROW_IMAGES);
            preloadImages(SPAWN_IMAGES);

            const spawner = new PopSpawner(SPAWN_IMAGES);
            new EyebrowButton(document.getElementById('eyebrow-btn'), EYEBROW_IMAGES, spawner);
        });

        (() => {
          const canvas = document.getElementById("spore-canvas");
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          if (!ctx) return;

          const IS_TOUCH = window.matchMedia("(hover: none), (pointer: coarse)").matches;
          const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const FRAME_MS = IS_TOUCH ? 1000 / 30 : 0;
          let lastFrame = 0;

          let width = 0;
          let height = 0;
          let spores = [];
          let mouseX = 0;
          let mouseY = 0;
          let animationId = null;

          const colors = ["#ff7ad9", "#4de1ff", "#ffe84a", "#b68cff", "#b6ff5c"];

          const GLOW = {};
          const STAR = {};

          function glowSprite(color) {
            if (GLOW[color]) return GLOW[color];
            const c = document.createElement("canvas");
            c.width = c.height = 64;
            const g = c.getContext("2d");
            const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, color + "dd");
            grad.addColorStop(0.25, color + "77");
            grad.addColorStop(0.6, color + "22");
            grad.addColorStop(1, color + "00");
            g.fillStyle = grad;
            g.fillRect(0, 0, 64, 64);
            return (GLOW[color] = c);
          }

          function starSprite(color) {
            if (STAR[color]) return STAR[color];
            const c = document.createElement("canvas");
            c.width = c.height = 64;
            const g = c.getContext("2d");
            g.translate(32, 32);
            g.shadowColor = color;
            g.shadowBlur = 8;
            const grad = g.createRadialGradient(0, 0, 0, 0, 0, 26);
            grad.addColorStop(0, "#ffffff");
            grad.addColorStop(0.3, color);
            grad.addColorStop(1, color + "bb");
            g.fillStyle = grad;
            g.beginPath();
            g.moveTo(0, -26);
            g.quadraticCurveTo(2.5, -2.5, 26, 0);
            g.quadraticCurveTo(2.5, 2.5, 0, 26);
            g.quadraticCurveTo(-2.5, 2.5, -26, 0);
            g.quadraticCurveTo(-2.5, -2.5, 0, -26);
            g.closePath();
            g.fill();
            return (STAR[color] = c);
          }

          function drawSpore(ctx, sp, x, y, advance) {
            if (advance) sp.tw += sp.twSpeed;
            const flash = Math.pow(0.5 + 0.5 * Math.sin(sp.tw), 3);
            const a = Math.min(1, sp.alpha + 0.25) * (0.3 + 0.7 * flash);

            if (sp.star) {
              const size = (9 + sp.size * 4.5) * (0.55 + 0.75 * flash);
              const halo = size * 1.6;
              ctx.globalAlpha = a * 0.55;
              ctx.drawImage(glowSprite(sp.color), x - halo, y - halo, halo * 2, halo * 2);
              ctx.globalAlpha = Math.min(1, a * 1.25);
              ctx.drawImage(starSprite(sp.color), x - size, y - size, size * 2, size * 2);
            } else {
              const halo = 5 + sp.size * 3.2 + flash * 7;
              ctx.globalAlpha = a * 0.8;
              ctx.drawImage(glowSprite(sp.color), x - halo, y - halo, halo * 2, halo * 2);
              ctx.globalAlpha = Math.min(1, a + 0.2);
              ctx.fillStyle = sp.color;
              ctx.beginPath();
              ctx.arc(x, y, sp.size * (0.8 + 0.5 * flash), 0, Math.PI * 2);
              ctx.fill();
            }
          }

          function createSpore(randomY = false) {
            return {
              x: Math.random() * width,
              y: randomY ? Math.random() * height : height + 10,
              size: Math.random() * 2.1 + 0.5,
              speed: Math.random() * 0.55 + 0.12,
              drift: (Math.random() - 0.5) * 0.45,
              alpha: Math.random() * 0.5 + 0.35,
              color: colors[Math.floor(Math.random() * colors.length)],
              phase: Math.random() * Math.PI * 2,
              tw: Math.random() * Math.PI * 2,
              twSpeed: 0.03 + Math.random() * 0.07,
              star: Math.random() < 0.2
            };
          }

          function render(advance) {
            ctx.clearRect(0, 0, width, height);
            ctx.globalCompositeOperation = "lighter";
            for (const spore of spores) {
              drawSpore(ctx, spore, spore.x + mouseX * 0.012, spore.y + mouseY * 0.012, advance);
            }
            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = 1;
          }

          function resize() {
            const ratio = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2);
            const prevWidth = width;

            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.round(width * ratio);
            canvas.height = Math.round(height * ratio);
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

            if (!spores.length || width !== prevWidth) {
              const count = Math.min(180, Math.max(60, Math.floor((width * height) / 8500)));
              const total = IS_TOUCH ? Math.ceil(count * 0.6) : count;
              spores = Array.from({ length: total }, () => createSpore(true));
            }

            if (reduceMotion) render(false);
          }

          function animate(now) {
            if (document.hidden) { animationId = requestAnimationFrame(animate); return; }
            if (FRAME_MS && now - lastFrame < FRAME_MS) { animationId = requestAnimationFrame(animate); return; }
            lastFrame = now || 0;

            for (const spore of spores) {
              spore.phase += 0.015;
              spore.x += spore.drift + Math.sin(spore.phase) * 0.12;
              spore.y -= spore.speed;

              if (spore.y < -10) Object.assign(spore, createSpore(false));
              if (spore.x < -10) spore.x = width + 10;
              if (spore.x > width + 10) spore.x = -10;
            }

            render(true);
            animationId = requestAnimationFrame(animate);
          }

          function stopAnimation() {
            if (animationId !== null) {
              cancelAnimationFrame(animationId);
              animationId = null;
            }
          }

          function startAnimation() {
            stopAnimation();
            if (reduceMotion) render(false);
            else animationId = requestAnimationFrame(animate);
          }

          window.addEventListener("resize", () => {
            resize();
            startAnimation();
          }, { passive: true });

          window.addEventListener("mousemove", (event) => {
            mouseX = event.clientX - width / 2;
            mouseY = event.clientY - height / 2;
          }, { passive: true });

          resize();
          startAnimation();
        })();

        (() => {
          const container = document.getElementById("stars");
          const fragment = document.createDocumentFragment();

          for (let i = 0; i < (window.matchMedia("(hover: none), (pointer: coarse)").matches ? 25 : 50); i++) {
            const star = document.createElement("span");

            star.textContent = "✦";
            star.setAttribute("aria-hidden", "true");

            Object.assign(star.style, {
              position: "absolute",
              left: Math.random() * 100 + "%",
              top: Math.random() * 100 + "%",
              color: i % 2 ? "#4de1ff" : "#ff7ad9",
              fontSize: Math.random() * 9 + 5 + "px",
              opacity: String(Math.random() * 0.55 + 0.12),
              textShadow: "0 0 8px currentColor",
              animation: `starBlink ${Math.random() * 3 + 2}s ease-in-out infinite alternate`,
              animationDelay: Math.random() * -5 + "s"
            });

            fragment.appendChild(star);
          }

          const style = document.createElement("style");
          style.textContent = `
            @keyframes starBlink {
              from { opacity: 0.12; }
              to { opacity: 0.85; }
            }
          `;

          document.head.appendChild(style);
          container.appendChild(fragment);
        })();

    </script>
</body>
</html>
