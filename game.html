* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background-color: var(--bg);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: #f8edff;
  background-color: var(--bg);
  background-image:
    var(--neon-tile);
  background-repeat: repeat;
  background-attachment: fixed;
  background-position: center;
  background-size: 408px 408px;
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  text-align: center;
}

a {
  color: inherit;
}

img {
  -webkit-user-drag: none;
  user-select: none;
  pointer-events: none;
}

#mycelium,
#spore-canvas,
#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#mycelium {
  z-index: 0;
  opacity: 0.3;
  background:
    radial-gradient(ellipse at 15% 25%, #642cff33, transparent 45%),
    radial-gradient(ellipse at 85% 65%, #ff36bd22, transparent 45%),
    radial-gradient(ellipse at 50% 90%, #00eaff1a, transparent 40%);
  animation: myceliumGlow 9s ease-in-out infinite alternate;
}

#spore-canvas {
  z-index: 1;
}

#stars {
  z-index: 1;
}

@keyframes myceliumGlow {
  from { opacity: 0.18; }
  to { opacity: 0.48; }
}

main {
  position: relative;
  z-index: 2;
  width: min(1040px, 93%);
  margin: 0 auto;
  padding: 55px 0 65px;
}

.big-frame {
  padding: 36px 26px 38px;
  border: 2px solid #ff7ad9;
  border-radius: 24px;
  background: rgba(8, 6, 32, 0.42);
  box-shadow:
    0 0 15px #ff7ad988,
    0 0 35px #ff3dc844,
    inset 0 0 25px #b68cff33;
  backdrop-filter: blur(3px);
  animation: fadeIn 1.6s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  margin: 0 0 6px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo-link {
  display: inline-block;
  position: relative;
  text-decoration: none;
}

.neon-kinoko-dosei {
  pointer-events: auto;
  cursor: pointer;
  max-width: 100%;
  height: auto;
  max-height: 180px;
  object-fit: contain;
  transition: transform 0.2s ease;
  animation: ultraSoftRainbowNeon 6s infinite ease-in-out;
}

.neon-kinoko-dosei.is-pop {
  animation: fluffy-bounce 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), ultraSoftRainbowNeon 6s infinite ease-in-out;
}

@keyframes fluffy-bounce {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.35) rotate(-3deg); }
  60%  { transform: scale(0.92) rotate(2deg); }
  80%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.logo-sparkle-particle {
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  z-index: 100;
  animation: pop-particle 0.6s ease-out forwards;
}

@keyframes pop-particle {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(var(--tx), var(--ty)) scale(0);
  }
}

@keyframes ultraSoftRainbowNeon {
  0%, 100% {
    filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 15px #ff7ad9) drop-shadow(0 0 25px #ff3dc8);
    opacity: 0.8;
  }
  50% {
    filter: drop-shadow(0 0 12px #fff) drop-shadow(0 0 28px #4de1ff) drop-shadow(0 0 50px #00eaff);
    opacity: 1;
  }
}

.tagline {
  margin: 0 0 14px;
  color: var(--cyan);
  letter-spacing: 0.08em;
  text-shadow: 0 0 10px #4de1ff99;
}

.marquee {
  margin: 0 0 34px;
  padding: 6px 0;
  overflow: hidden;
  white-space: nowrap;
  text-align: left;
}

.marquee p {
  display: inline-block;
  margin: 0;
  padding-left: 100%;
  color: var(--yellow);
  letter-spacing: 0.08em;
  text-shadow: 0 0 10px #ffe84a66;
  animation: scrollText 25s linear infinite;
}

@keyframes scrollText {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}

.site-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 22px;
  margin: 0 auto 36px;
}

.site-card {
  --card-color: #62f7ff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 24px 20px;
  border: 2px solid var(--card-color); 
  border-radius: 16px;
  background: rgba(8, 8, 32, 0.40);
  box-shadow: 
    0 0 12px color-mix(in srgb, var(--card-color) 60%, transparent),
    inset 0 0 15px color-mix(in srgb, var(--card-color) 20%, transparent);
  backdrop-filter: blur(2px);
  transition:
    transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    box-shadow 0.3s ease,
    border-color 0.3s ease;
}

.site-card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow:
    0 0 20px var(--card-color),
    0 0 35px color-mix(in srgb, var(--card-color) 60%, transparent);
}

.site-card:nth-child(6n + 1) { --card-color: #62f7ff; }
.site-card:nth-child(6n + 2) { --card-color: #b6ff5c; }
.site-card:nth-child(6n + 3) { --card-color: #b68cff; }
.site-card:nth-child(6n + 4) { --card-color: #ffb85c; }
.site-card:nth-child(6n + 5) { --card-color: #ffe84a; }
.site-card:nth-child(6n + 6) { --card-color: #ff7ad9; }

.site-card h3 {
  margin: 0 0 10px;
  color: #fff;
  font-size: 1.15rem;
  line-height: 1.5;
  text-shadow: 0 0 12px var(--card-color);
}

.site-card p {
  flex-grow: 1;
  margin: 0 0 20px;
  color: #f0eaff;
  font-size: 0.9rem;
  line-height: 1.7;
}

.card-button {
  --btn-color: #b6ff5c;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 12px;
  border: 2px solid var(--btn-color);
  border-radius: 12px;
  background: rgba(8, 8, 32, 0.75);
  color: #ffffff;
  font-weight: bold;
  letter-spacing: 0.06em;
  text-decoration: none;
  text-shadow: 0 0 8px var(--btn-color);
  box-shadow: 
    0 0 10px color-mix(in srgb, var(--btn-color) 50%, transparent),
    inset 0 0 8px color-mix(in srgb, var(--btn-color) 25%, transparent);
  transition:
    transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    box-shadow 0.2s ease,
    background 0.2s ease,
    color 0.2s ease;
}

.card-button:hover,
.card-button:focus-visible {
  color: #070720;
  background: var(--btn-color); 
  transform: translateY(-4px) scale(1.04);
  box-shadow:
    0 0 18px var(--btn-color),
    0 0 35px var(--btn-color);
  outline: none;
  text-shadow: none;
}

.site-card:nth-child(6n + 1) .card-button { --btn-color: #b6ff5c; }
.site-card:nth-child(6n + 2) .card-button { --btn-color: #b68cff; }
.site-card:nth-child(6n + 3) .card-button { --btn-color: #ffb85c; }
.site-card:nth-child(6n + 4) .card-button { --btn-color: #ffe84a; }
.site-card:nth-child(6n + 5) .card-button { --btn-color: #ff7ad9; }
.site-card:nth-child(6n + 6) .card-button { --btn-color: #62f7ff; }

@media (max-width: 700px) {
  main {
    padding-top: 25px;
  }

  .big-frame {
    padding: 26px 14px 28px;
  }

  .site-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
@media (hover: none), (pointer: coarse) {
  *, *::before, *::after {
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
}

.big-frame {
  position: relative;
  isolation: isolate;
}

.big-frame::before,
.big-frame::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  pointer-events: none;
  z-index: -1;
}

.big-frame::before {
  box-shadow:
    0 0 22px 3px #ff7ad9,
    0 0 52px 6px #ff3dc8aa,
    inset 0 0 30px #ff7ad966;
  animation: frameGlowA 3.4s ease-in-out infinite alternate;
}

.big-frame::after {
  box-shadow:
    0 0 22px 3px #4de1ff,
    0 0 52px 6px #b68cffaa,
    inset 0 0 30px #4de1ff55;
  animation: frameGlowB 3.4s ease-in-out infinite alternate;
}

@keyframes frameGlowA {
  from { opacity: 0.35; }
  to   { opacity: 1; }
}

@keyframes frameGlowB {
  from { opacity: 1; }
  to   { opacity: 0.25; }
}

@keyframes frameBorderShift {
  0%   { border-color: #ff7ad9; }
  33%  { border-color: #b68cff; }
  66%  { border-color: #4de1ff; }
  100% { border-color: #ff7ad9; }
}

@media (prefers-reduced-motion: reduce) {
  .big-frame,
  .big-frame::before,
  .big-frame::after {
    animation: none !important;
  }
  .big-frame::before { opacity: 0.7; }
  .big-frame::after { opacity: 0.4; }
}

.big-frame { animation: fadeIn 1.6s ease, frameBorderShift 8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .big-frame { animation: none !important; } }
.page-back-wrap {
  margin: 34px 0 0;
  text-align: center;
  line-height: 0;
}

.page-back {
  display: inline-block;
  -webkit-tap-highlight-color: transparent;
}

.page-back img {
  display: block;
  width: min(140px, 44vw);
  height: auto;
  cursor: pointer;
  filter: drop-shadow(0 0 10px rgba(255, 122, 217, 0.55));
  transition:
    transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    filter 0.25s ease;
}

.page-back:hover img,
.page-back:focus-visible img {
  transform: scale(1.06);
  filter: drop-shadow(0 0 16px #ff7ad9);
}

.page-back:focus-visible {
  outline: 2px dashed #4de1ff;
  outline-offset: 4px;
  border-radius: 12px;
}

.page-back img.is-pop {
  animation: back-boyon 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes back-boyon {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.35) rotate(-3deg); }
  60%  { transform: scale(0.92) rotate(2deg); }
  80%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}
</style>
</head>

<script>
"use strict";

document.addEventListener("contextmenu", (e) => {
  e.preventDefault();
});

document.addEventListener("dragstart", (e) => {
  if (e.target.tagName === "IMG") {
    e.preventDefault();
  }
});

(() => {
  const logoLink = document.getElementById("logoLink");
  const logoImg = document.getElementById("logoImg");

  if (!logoLink || !logoImg) return;

  function playBounceSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';

      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    } catch (e) {
    }
  }

  function createLogoSparkles(rect) {
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const colors = ['#ffe84a', '#ff7ad9', '#4de1ff', '#b6ff5c', '#ffffff'];

    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'logo-sparkle-particle';
      
      const size = Math.random() * 8 + 4;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = centerX + 'px';
      p.style.top = centerY + 'px';

      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 70 + 30;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');

      document.body.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
  }

  logoLink.addEventListener("click", (e) => {
    const href = logoLink.getAttribute("href");
    if (href && href !== "#") {
      e.preventDefault();

      logoImg.classList.remove("is-pop");
      void logoImg.offsetWidth; 
      logoImg.classList.add("is-pop");

      playBounceSound();
      createLogoSparkles(logoImg.getBoundingClientRect());

      setTimeout(() => {
        window.location.href = href;
      }, 350);
    }
  });
})();

(() => {
  const canvas = document.getElementById("spore-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  const IS_TOUCH = window.matchMedia("(hover: none), (pointer: coarse)").matches;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const FRAME_MS = IS_TOUCH ? 1000 / 30 : 0;
  let lastFrame = 0;

  let width = 0;
  let height = 0;
  let spores = [];
  let mouseX = 0;
  let mouseY = 0;
  let animationId = null;

  const colors = ["#ff7ad9", "#4de1ff", "#ffe84a", "#b68cff", "#b6ff5c"];

  const GLOW = {};
  const STAR = {};

  function glowSprite(color) {
    if (GLOW[color]) return GLOW[color];
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, color + "dd");
    grad.addColorStop(0.25, color + "77");
    grad.addColorStop(0.6, color + "22");
    grad.addColorStop(1, color + "00");
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return (GLOW[color] = c);
  }

  function starSprite(color) {
    if (STAR[color]) return STAR[color];
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    g.translate(32, 32);
    g.shadowColor = color;
    g.shadowBlur = 8;
    const grad = g.createRadialGradient(0, 0, 0, 0, 0, 26);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.3, color);
    grad.addColorStop(1, color + "bb");
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(0, -26);
    g.quadraticCurveTo(2.5, -2.5, 26, 0);
    g.quadraticCurveTo(2.5, 2.5, 0, 26);
    g.quadraticCurveTo(-2.5, 2.5, -26, 0);
    g.quadraticCurveTo(-2.5, -2.5, 0, -26);
    g.closePath();
    g.fill();
    return (STAR[color] = c);
  }

  function drawSpore(ctx, sp, x, y, advance) {
    if (advance) sp.tw += sp.twSpeed;
    const flash = Math.pow(0.5 + 0.5 * Math.sin(sp.tw), 3);
    const a = Math.min(1, sp.alpha + 0.25) * (0.3 + 0.7 * flash);

    if (sp.star) {
      const size = (9 + sp.size * 4.5) * (0.55 + 0.75 * flash);
      const halo = size * 1.6;
      ctx.globalAlpha = a * 0.55;
      ctx.drawImage(glowSprite(sp.color), x - halo, y - halo, halo * 2, halo * 2);
      ctx.globalAlpha = Math.min(1, a * 1.25);
      ctx.drawImage(starSprite(sp.color), x - size, y - size, size * 2, size * 2);
    } else {
      const halo = 5 + sp.size * 3.2 + flash * 7;
      ctx.globalAlpha = a * 0.8;
      ctx.drawImage(glowSprite(sp.color), x - halo, y - halo, halo * 2, halo * 2);
      ctx.globalAlpha = Math.min(1, a + 0.2);
      ctx.fillStyle = sp.color;
      ctx.beginPath();
      ctx.arc(x, y, sp.size * (0.8 + 0.5 * flash), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function createSpore(randomY = false) {
    return {
      x: Math.random() * width,
      y: randomY ? Math.random() * height : height + 10,
      size: Math.random() * 2.1 + 0.5,
      speed: Math.random() * 0.55 + 0.12,
      drift: (Math.random() - 0.5) * 0.45,
      alpha: Math.random() * 0.5 + 0.35,
      color: colors[Math.floor(Math.random() * colors.length)],
      phase: Math.random() * Math.PI * 2,
      tw: Math.random() * Math.PI * 2,
      twSpeed: 0.03 + Math.random() * 0.07,
      star: Math.random() < 0.2
    };
  }

  function render(advance) {
    ctx.clearRect(0, 0, width, height);
    ctx.globalCompositeOperation = "lighter";
    for (const spore of spores) {
      drawSpore(ctx, spore, spore.x + mouseX * 0.012, spore.y + mouseY * 0.012, advance);
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2);
    const prevWidth = width;

    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    if (!spores.length || width !== prevWidth) {
      const count = Math.min(180, Math.max(60, Math.floor((width * height) / 8500)));
      const total = IS_TOUCH ? Math.ceil(count * 0.6) : count;
      spores = Array.from({ length: total }, () => createSpore(true));
    }

    if (reduceMotion) render(false);
  }

  function animate(now) {
    if (document.hidden) { animationId = requestAnimationFrame(animate); return; }
    if (FRAME_MS && now - lastFrame < FRAME_MS) { animationId = requestAnimationFrame(animate); return; }
    lastFrame = now || 0;

    for (const spore of spores) {
      spore.phase += 0.015;
      spore.x += spore.drift + Math.sin(spore.phase) * 0.12;
      spore.y -= spore.speed;

      if (spore.y < -10) Object.assign(spore, createSpore(false));
      if (spore.x < -10) spore.x = width + 10;
      if (spore.x > width + 10) spore.x = -10;
    }

    render(true);
    animationId = requestAnimationFrame(animate);
  }

  function stopAnimation() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
  }

  function startAnimation() {
    stopAnimation();
    if (reduceMotion) render(false);
    else animationId = requestAnimationFrame(animate);
  }

  window.addEventListener("resize", () => {
    resize();
    startAnimation();
  }, { passive: true });

  window.addEventListener("mousemove", (event) => {
    mouseX = event.clientX - width / 2;
    mouseY = event.clientY - height / 2;
  }, { passive: true });

  resize();
  startAnimation();
})();

(() => {
  const container = document.getElementById("stars");
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < (window.matchMedia("(hover: none), (pointer: coarse)").matches ? 25 : 50); i++) {
    const star = document.createElement("span");

    star.textContent = "✦";
    star.setAttribute("aria-hidden", "true");

    Object.assign(star.style, {
      position: "absolute",
      left: Math.random() * 100 + "%",
      top: Math.random() * 100 + "%",
      color: i % 2 ? "#4de1ff" : "#ff7ad9",
      fontSize: Math.random() * 9 + 5 + "px",
      opacity: String(Math.random() * 0.55 + 0.12),
      textShadow: "0 0 8px currentColor",
      animation: `starBlink ${Math.random() * 3 + 2}s ease-in-out infinite alternate`,
      animationDelay: Math.random() * -5 + "s"
    });

    fragment.appendChild(star);
  }

  const style = document.createElement("style");
  style.textContent = `
    @keyframes starBlink {
      from { opacity: 0.12; }
      to { opacity: 0.85; }
    }
  `;

  document.head.appendChild(style);
  container.appendChild(fragment);
})();

document.addEventListener("click", (event) => {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    return;
  }

  const colors = ["#ff7ad9", "#4de1ff", "#ffe84a", "#b68cff"];

  for (let i = 0; i < 6; i++) {
    const spark = document.createElement("span");
    const angle = Math.PI * 2 * i / 6;
    const distance = 18 + Math.random() * 24;

    spark.textContent = "✦";

    Object.assign(spark.style, {
      position: "fixed",
      left: event.clientX + "px",
      top: event.clientY + "px",
      zIndex: "99",
      pointerEvents: "none",
      color: colors[i % colors.length],
      fontSize: "13px",
      textShadow: "0 0 8px currentColor",
      transition: "transform 550ms ease-out, opacity 550ms ease-out"
    });

    document.body.appendChild(spark);

    requestAnimationFrame(() => {
      spark.style.transform =
        `translate(${Math.cos(angle) * distance}px,${Math.sin(angle) * distance}px)`;
      spark.style.opacity = "0";
    });

    window.setTimeout(() => spark.remove(), 650);
  }
});

(() => {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const targets = document.querySelectorAll(".neon-kinoko-dosei, .card-button");
  const colors = ["#ff65c3", "#b6ff5c", "#62f7ff", "#b68cff", "#ffb85c", "#ffe84a"];
  const marks = ["✦", "✧", "✨"];

  function sparkle(element) {
    const rect = element.getBoundingClientRect();
    const spark = document.createElement("span");

    spark.textContent = marks[Math.floor(Math.random() * marks.length)];

    Object.assign(spark.style, {
      position: "absolute",
      left: rect.left + Math.random() * rect.width + "px",
      top: rect.top + Math.random() * rect.height + "px",
      zIndex: "99",
      pointerEvents: "none",
      color: colors[Math.floor(Math.random() * colors.length)],
      fontSize: 9 + Math.random() * 10 + "px",
      textShadow: "0 0 8px currentColor",
      opacity: "1",
      transition: "transform 750ms ease-out, opacity 750ms ease-out"
    });

    document.body.appendChild(spark);

    requestAnimationFrame(() => {
      const dx = (Math.random() - 0.5) * 44;
      const dy = -(18 + Math.random() * 32);
      const rot = (Math.random() - 0.5) * 180;
      spark.style.transform =
        `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.4)`;
      spark.style.opacity = "0";
    });

    window.setTimeout(() => spark.remove(), 800);
  }

  targets.forEach((element) => {
    let timer = null;

    element.addEventListener("mouseenter", () => {
      if (timer) return;
      sparkle(element);
      timer = window.setInterval(() => sparkle(element), 90);
    });

    element.addEventListener("mouseleave", () => {
      window.clearInterval(timer);
      timer = null;
    });
  });
})();
</script>
<script>
(() => {
  const link = document.querySelector(".page-back");
  const img = link && link.querySelector("img");
  if (!link || !img) return;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let audioCtx = null;

  function playBounceSound() {
    try {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;

      if (!audioCtx) audioCtx = new AudioCtor();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const t = audioCtx.currentTime;

      osc.type = "sine";
      osc.frequency.setValueAtTime(320, t);
      osc.frequency.exponentialRampToValueAtTime(850, t + 0.12);

      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(t + 0.18);
    } catch (e) {
    }
  }

  link.addEventListener("click", (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    const href = link.getAttribute("href");
    if (!href || href === "#" || reduceMotion) return;

    e.preventDefault();
    img.classList.remove("is-pop");
    void img.offsetWidth;
    img.classList.add("is-pop");

    playBounceSound();

    setTimeout(() => {
      window.location.href = href;
    }, 350);
  });
})();
</script>
