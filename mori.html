    * {

    body {

      color: #fff;

    #background-image {
      position: fixed;
      inset: 0;

      background-repeat: repeat;
      background-position: center;

    #background-wrap {
      position: fixed;

      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      transition: transform 0.1s ease-out;
    }

    #mycelium {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(
          circle at 30% 40%,
          rgba(255, 122, 217, 0.28) 0%,
          transparent 55%

        radial-gradient(
          circle at 70% 60%,
          rgba(77, 225, 255, 0.25) 0%,
          transparent 55%

    }

    @keyframes breathe {
      from { opacity: 0.3; }

    #spores {

      text-shadow: 0 0 8px var(--neon-yellow);

      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 8px var(--neon-pink);
      font-size: 1.05em;

    label {
      display: block;
      margin: 10px 0;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 10px;
      color: #d8c8ff;
      transition: all 0.2s ease;

    label:hover {
      background: rgba(255, 122, 217, 0.22);
      color: #fff;
      text-shadow: 0 0 8px var(--neon-pink);
      transform: translateX(6px);
    }

    input[type="radio"] {
      margin-right: 10px;
      accent-color: var(--neon-pink);
      transform: scale(1.2);

    .submit-btn {
      display: block;
      margin: 2rem auto 0;
      padding: 1rem 2.5rem;
      background: rgba(18, 10, 40, 0.75);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: bold;

      color: #070720;

        0 0 38px var(--neon-purple);
      text-shadow: none;

    .shard {
      position: fixed;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 20px solid var(--neon-purple);
      pointer-events: none;
      z-index: 9999;

      position: absolute;
      border-radius: 50%;

      0%, 100% { opacity: 0.3; }

.outer-container {

.outer-container::before,

}

  box-shadow:

}

.outer-container::after {
  box-shadow:
    0 0 22px 3px #4de1ff,

  animation: frameGlowB 3.4s ease-in-out infinite alternate;
}

@keyframes frameGlowA {
  from { opacity: 0.35; }

}

@keyframes frameGlowB {

  to   { opacity: 0.25; }
}

const bgWrap = document.getElementById("background-wrap");

let w, h, spores = [];
const IS_TOUCH = window.matchMedia("(hover: none), (pointer: coarse)").matches;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastFrame = 0;

const GLOW = {};
const STAR = {};

function glowSprite(color) {
  if (GLOW[color]) return GLOW[color];
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, color + "dd");
  grad.addColorStop(0.25, color + "77");
  grad.addColorStop(0.6, color + "22");
  grad.addColorStop(1, color + "00");
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return (GLOW[color] = c);
}

function starSprite(color) {
  if (STAR[color]) return STAR[color];
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  g.translate(32, 32);
  g.shadowColor = color;
  g.shadowBlur = 8;
  const grad = g.createRadialGradient(0, 0, 0, 0, 0, 26);
  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(0.3, color);
  grad.addColorStop(1, color + "bb");
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(0, -26);
  g.quadraticCurveTo(2.5, -2.5, 26, 0);
  g.quadraticCurveTo(2.5, 2.5, 0, 26);
  g.quadraticCurveTo(-2.5, 2.5, -26, 0);
  g.quadraticCurveTo(-2.5, -2.5, 0, -26);
  g.closePath();
  g.fill();
  return (STAR[color] = c);
}

let STEP = 1;
function drawSpore(ctx, sp, x, y, advance) {
  if (advance) sp.tw += sp.twSpeed * STEP;
  const flash = Math.pow(0.5 + 0.5 * Math.sin(sp.tw), 3);
  const a = Math.min(1, sp.alpha + 0.25) * (0.3 + 0.7 * flash);

  if (sp.star) {
    const size = (9 + sp.size * 4.5) * (0.55 + 0.75 * flash);
    const halo = size * 1.6;
    ctx.globalAlpha = a * 0.55;
    ctx.drawImage(glowSprite(sp.color), x - halo, y - halo, halo * 2, halo * 2);
    ctx.globalAlpha = Math.min(1, a * 1.25);
    ctx.drawImage(starSprite(sp.color), x - size, y - size, size * 2, size * 2);
  } else {
    const halo = 5 + sp.size * 3.2 + flash * 7;
    ctx.globalAlpha = a * 0.8;
    ctx.drawImage(glowSprite(sp.color), x - halo, y - halo, halo * 2, halo * 2);
    ctx.globalAlpha = Math.min(1, a + 0.2);
    ctx.fillStyle = sp.color;
    ctx.beginPath();
    ctx.arc(x, y, sp.size * (0.8 + 0.5 * flash), 0, Math.PI * 2);
    ctx.fill();
  }
}

function colorAt(x) {
  const idx = Math.min(NEON_COLORS.length - 1, Math.floor((x / w) * NEON_COLORS.length));
  return NEON_COLORS[idx];
}

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;

  spores = Array.from({ length: IS_TOUCH ? 80 : 150 }, () => {
    const z = Math.random() * 2;
    return {
      x: Math.random() * w,
      y: Math.random() * h,
      z: z,
      size: 0.6 + Math.random() * 1.4 + z * 0.35,
      alpha: Math.random() * 0.5 + 0.35,
      color: NEON_COLORS[0],
      tw: Math.random() * Math.PI * 2,
      twSpeed: 0.03 + Math.random() * 0.07,
      star: Math.random() < 0.2
    };
  });

  if (reduceMotion) drawAll(false);
}

function drawAll(advance) {
  ctx.clearRect(0, 0, w, h);
  ctx.globalCompositeOperation = "lighter";
  spores.forEach((s) => {
    s.color = colorAt(s.x);
    drawSpore(ctx, s, s.x, s.y, advance);
  });
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}

function draw(now) {
  if (now === undefined) now = performance.now();
  if (document.hidden || (now - lastFrame < (IS_TOUCH ? 33 : 31))) {
    requestAnimationFrame(draw);
    return;
  }
  if (!IS_TOUCH) STEP = Math.min(3, Math.max(1, (now - lastFrame) / 16.667));
  lastFrame = now || 0;
  const t = Date.now();

  spores.forEach(s => {
    s.x += Math.sin(t * 0.0001 + s.y) * 0.1 * s.z * STEP;
    s.y += Math.cos(t * 0.00005 + s.x) * 0.1 * s.z * STEP;

    if (s.x < 0) s.x = w;
    if (s.x > w) s.x = 0;
    if (s.y < 0) s.y = h;
    if (s.y > h) s.y = 0;
  });

  drawAll(true);
  requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);
resize();
if (!reduceMotion) draw();

let pmx = 0, pmy = 0, pmRaf = 0;
document.addEventListener("mousemove", (e) => {
  const moveX =
    (e.clientX / window.innerWidth - 0.5) * 30;

  const moveY =
    (e.clientY / window.innerHeight - 0.5) * 30;

  pmx = moveX; pmy = moveY;
  if (!pmRaf) pmRaf = requestAnimationFrame(() => {
    pmRaf = 0;
    bgWrap.style.transform = `translate(${-pmx}px,${-pmy}px)`;
  });
});

document.addEventListener('click', (e) => {
  const shardCount = 12;

  for (let i = 0; i < shardCount; i++) {
    const shard = document.createElement('div');
    shard.className = 'shard';

    const color =
      NEON_COLORS[
        Math.floor(Math.random() * NEON_COLORS.length)
      ];

    const size = Math.random() * 12 + 4;

    shard.style.borderBottom =
      `${size * 2}px solid ${color}`;

    shard.style.borderLeftWidth = `${size}px`;
    shard.style.borderRightWidth = `${size}px`;

    shard.style.left = e.clientX + 'px';
    shard.style.top = e.clientY + 'px';

    const angle = Math.random() * Math.PI * 2;
    const velocity = Math.random() * 120 + 40;

    const tx = Math.cos(angle) * velocity;
    const ty = Math.sin(angle) * velocity;
    const rot = Math.random() * 360;

    document.body.appendChild(shard);

    const anim = shard.animate(
      [
        {
          transform:
            'translate(-50%, -50%) rotate(0deg) scale(1)',
          opacity: 1
        },
        {
          transform:
            `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg) scale(0)`,
          opacity: 0
        }
      ],
      {
        duration: 600,
        easing: 'ease-out'
      }
    );

    anim.onfinish = () => shard.remove();
  }
});

window.addEventListener("DOMContentLoaded", () => {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const targets = document.querySelectorAll(".page-title, .submit-btn, .title-img");
  const marks = ["✦", "✧", "✨"];

  function sparkle(element) {
    const rect = element.getBoundingClientRect();
    const spark = document.createElement("span");

    spark.textContent = marks[Math.floor(Math.random() * marks.length)];

    const sparkLeft = rect.left + window.scrollX + Math.random() * rect.width;
    const sparkTop = rect.top + window.scrollY + Math.random() * rect.height;

    Object.assign(spark.style, {
      position: "absolute",
      left: sparkLeft + "px",
      top: sparkTop + "px",
      zIndex: "9999",
      pointerEvents: "none",
      color: NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)],
      fontSize: (9 + Math.random() * 10) + "px",
      textShadow: "0 0 8px currentColor",
      opacity: "1",
      transition: "transform 750ms ease-out, opacity 750ms ease-out"
    });

    document.body.appendChild(spark);

    requestAnimationFrame(() => {
      const dx = (Math.random() - 0.5) * 44;
      const dy = -(18 + Math.random() * 32);
      const rot = (Math.random() - 0.5) * 180;
      spark.style.transform =
        `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.4)`;
      spark.style.opacity = "0";
    });

    window.setTimeout(() => spark.remove(), 800);
  }

  targets.forEach((element) => {
    let timer = null;

    element.addEventListener("mouseenter", () => {
      if (timer) return;
      sparkle(element);
      timer = window.setInterval(() => sparkle(element), 90);
    });

    element.addEventListener("mouseleave", () => {
      if (timer) {
        window.clearInterval(timer);
        timer = null;
      }
    });
  });
});

const correctAnswers = {
  q1: 'c',
  q2: 'b'
};

function checkAnswers() {
  let score = 0;

  for (let key in correctAnswers) {
    const selected = document.querySelector(
      `input[name="${key}"]:checked`
    );

    if (selected && selected.value === correctAnswers[key]) {
      score++;
    }
  }

  if (score === Object.keys(correctAnswers).length) {
    alert("おめでとう( 👁️ _ 👁️ )✨");
    window.location.href = "mori1.html";
  } else {
    alert("ぶぶ漬け食べなはれや( ´ᯅ` )");
    window.location.href = "index.html";
  }
}

const starsLayer = document.createElement("div");
starsLayer.className = "stars-layer";
for (let i = 0; i < (window.matchMedia("(hover: none), (pointer: coarse)").matches ? 25 : 50); i++) {
  const star = document.createElement("div");
  star.classList.add("star");

  const color =
    NEON_COLORS[
      Math.floor(Math.random() * NEON_COLORS.length)
    ];

  star.style.background = color;
  star.style.boxShadow = `0 0 6px ${color}`;
  star.style.width = star.style.height =
    Math.random() * 2 + "px";

  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";

  starsLayer.appendChild(star);
}
bgWrap.appendChild(starsLayer);
</script>

<script>
(() => {
  const logoLink = document.getElementById("logoLink");
  const logoImg = document.getElementById("logoImg");
  if (!logoLink || !logoImg) return;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pending = false;

  function playBounceSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    } catch (e) {}
  }

  function createLogoSparkles(rect) {
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const colors = ["#ffe84a", "#ff7ad9", "#4de1ff", "#b6ff5c", "#ffffff"];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement("div");
      p.className = "logo-sparkle-particle";
      const size = Math.random() * 8 + 4;
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = cx + "px";
      p.style.top = cy + "px";
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 70 + 30;
      p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--ty", Math.sin(angle) * dist + "px");
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
  }

  logoLink.addEventListener("click", (e) => {
    if (e.defaultPrevented || e.button !== 0 ||
        e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const href = logoLink.getAttribute("href");
    if (!href || href === "#") return;

    e.preventDefault();
    if (pending) return;
    pending = true;

    if (reduceMotion) { window.location.href = href; return; }

    logoImg.classList.remove("is-pop");
    void logoImg.offsetWidth;
    logoImg.classList.add("is-pop");
    playBounceSound();
    createLogoSparkles(logoImg.getBoundingClientRect());

    setTimeout(() => { window.location.href = href; }, 350);
  });

  window.addEventListener("pageshow", () => {
    pending = false;
    logoImg.classList.remove("is-pop");
  });
})();
</script>
